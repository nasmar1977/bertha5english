// --- Auswertung: Quoten, hartnäckig, geschafft
function lernstand(runs) {
  const skills = {}, mu = {};
  runs.forEach((r, ri) => r.items.forEach(x => {
    const s = skills[x.skill] = skills[x.skill] || { skill: x.skill, ok: 0, n: 0, runs: {}, ex: [] };
    s.n++; if (x.ok) s.ok++;
    const rr = s.runs[ri] = s.runs[ri] || { label: r.label, ok: 0, n: 0, t: 0, ri };
    rr.n++; if (x.ok) rr.ok++; rr.t = Math.max(rr.t, x.t || 0);
    if (!x.ok && x.ex && s.ex.length < 2) s.ex.push(x.ex);
    if (x.m) {
      const p = mu[x.m.key] = mu[x.m.key] || { key: x.m.key, label: x.m.label, skill: x.skill, runs: new Set(), ex: [], verben: {}, wort: x.m.wort };
      p.runs.add(ri);
      if (x.ex && p.ex.length < 2) p.ex.push(x.ex);
      if (x.m.verb) (p.verben[x.m.verb] = p.verben[x.m.verb] || new Set()).add(ri);

  Object.values(skills).forEach(s => {
    const liste = Object.values(s.runs).sort((a, b) => a.t - b.t || a.ri - b.ri);
    const fehlerRuns = liste.filter(r => r.ok < r.n);
    const letzte = liste[liste.length - 1];
    s.liste = liste;

    s.geschafft = s.skill !== 'spelling' && !!letzte && letzte.n >= 3 && letzte.ok === letzte.n && fehlerRuns.length > 0;
    // Hartnäckig: Fehler in ≥ 2 Durchgängen UND (Quote unter 80 % ODER Fehler in 2 der letzten 3)
    s.letzteDrei = liste.slice(-3);
    s.hart = !s.geschafft && fehlerRuns.length >= 2 && (s.ok / s.n < 0.8 || s.letzteDrei.filter(r => r.ok < r.n).length >= 2);
    s.letzte = letzte;
  });

    const s = skills[p.skill];
    p.geschafft = !!s.letzte && s.letzte.n >= 3 && s.letzte.ok === s.letzte.n && !p.runs.has(s.letzte.ri) && p.skill !== 'spelling';
    p.hart = !p.geschafft && p.runs.size >= 2
      && (p.skill === 'spelling' || s.ok / s.n < 0.8 || s.letzteDrei.filter(r => p.runs.has(r.ri)).length >= 2);
    const verben = Object.entries(p.verben).filter(([, r]) => r.size >= 2).map(([v]) => v);
    if (verben.length) p.label += ' (' + verben.join(', ') + ')';
  });
  const hartMuster = Object.values(mu).filter(p => p.hart).sort((a, b) => b.runs.size - a.runs.size);
  const mitMuster = new Set(hartMuster.map(p => p.skill));
  const hartSkills = Object.values(skills).filter(s => s.hart && !mitMuster.has(s.skill) && s.skill !== 'spelling')
    .sort((a, b) => a.ok / a.n - b.ok / b.n).map(s => ({ key: s.skill, label: SKILL_LABEL[s.skill], skill: s.skill, ex: s.ex, runs: { size: Object.values(s.runs).filter(r => r.ok < r.n).length } }));
  const baustellen = hartMuster.concat(hartSkills).slice(0, 3);
  const geschafft = Object.values(skills).filter(s => s.geschafft).map(s => SKILL_LABEL[s.skill])
    .concat(Object.values(mu).filter(p => p.geschafft && !skills[p.skill].geschafft).map(p => p.label));
  const woerter = [...new Set(Object.values(mu).filter(p => p.wort).map(p => p.wort))];
  return { skills, muster: mu, baustellen, geschafft, woerter, hartAlle: hartMuster.concat(hartSkills) };
}
// --- Verdichtete Übersicht für den Gesamt-Lernplan (keine Einzelantworten außer ≤ 2 Beispielen)
function lernstandText(ls) {
  const zeilen = [];
  zeilen.push('Fertigkeiten (richtig von gesamt): ' + SKILLS.filter(([k]) => ls.skills[k] && k !== 'spelling')
    .map(([k, l]) => `${l} ${ls.skills[k].ok}/${ls.skills[k].n}`).join('; '));
  ls.hartAlle.slice(0, 5).forEach(p => zeilen.push('Hartnäckig: ' + p.label + (p.ex && p.ex.length
    ? ' – Beispiele: ' + p.ex.slice(0, 2).map(e => `du "${String(e.du).slice(0, 40)}" → richtig "${String(e.richtig).slice(0, 50)}"`).join('; ') : '')));
  if (ls.geschafft.length) zeilen.push('Geschafft: ' + ls.geschafft.join(', '));
  if (ls.woerter.length) zeilen.push('Wörter zum Üben: ' + ls.woerter.slice(0, 15).join(', '));
  return zeilen.join('\n').slice(0, 2500);
}
const lernstandStand = runs => runs.map(r => r.label + ':' + r.items.length + ':' + r.items.filter(x => x.ok).length).join('|');
function readGesamt() { try { return JSON.parse(localStorage.getItem(GESAMT_KEY) || 'null'); } catch (e) { return null; } }
// --- Anzeige im Menü
function lernstandHtml() {
  const runs = lernstandRuns();
  if (!runs.some(r => r.items.length)) return '';
  const ls = lernstand(runs), plan = readGesamt(), stand = lernstandStand(runs);
  const bsp = e => `<span class="bsp">du: <del>${esc(e.du)}</del> → richtig: <ins>${esc(e.richtig)}</ins></span>`;
  const baustellen = ls.baustellen.length
    ? ls.baustellen.map(p => `<div class="baustelle"><b>🔧 ${esc(p.label)}</b>${(p.ex || []).slice(0, 2).map(bsp).join('')}</div>`).join('')
    : '<p class="task" style="margin:0">Noch keine hartnäckigen Fehler – stark!</p>';
  const zeilen = SKILLS.filter(([k]) => ls.skills[k]).map(([k, l]) => {
    const s = ls.skills[k];
    if (k === 'spelling') return `<span>📝 Wörter zum Üben</span><span class="quote">${s.n}</span><div class="mks"></div>`;
    const marker = s.liste.map(r => `<span class="mk ${r.ok === r.n ? 'ok' : 'no'}">${esc(r.label)} ${r.ok === r.n ? '✓' : '✗'}</span>`).join('');
    const quote = k === 'spelling' ? `${s.n} Wort${s.n === 1 ? '' : 'e'}` : Math.round(s.ok / s.n * 100) + ' %';
    return `<span>${esc(l)}</span><span class="quote">${quote}</span><div class="mks">${marker}</div>`;
  }).join('');
  const kannKi = typeof kiOn === 'function' ? kiOn() : !!sample;
  const busy = planBusy.has('gesamt');
  const planKnopf = !kannKi ? '' : `<button type="button" class="btn claude" id="ki-gesamt" data-gesamt ${busy ? 'disabled' : ''}>${busy ? '🤖 denkt nach …'
    : plan && plan.stand === stand ? '🤖 Gesamt-Lernplan neu schreiben' : plan ? '🤖 Gesamt-Lernplan aktualisieren' : '🤖 Gesamt-Lernplan'}</button>`;
  const planBox = plan && plan.text ? `<div class="claude-box">${esc(plan.text)}<br><small style="color:var(--muted)">Stand: ${new Date(plan.at).toLocaleString('de-DE', { dateStyle: 'short', timeStyle: 'short' })}${plan.stand !== stand ? ' – inzwischen gibt es neue Abgaben' : ''}</small></div>` : '';
  const err = gesamtFehler ? `<div class="claude-box">${esc(gesamtFehler)}</div>` : '';
  const training = trainingPlan(ls).total > 0
    ? '<button type="button" class="btn" style="background:var(--line-purple)" id="training-start" data-training>🎯 Übe deine hartnäckigen Fehler</button>' : '';
  return `<section class="lernstand" aria-label="Mein Lernstand"><h2>📈 Mein Lernstand</h2>
    <div><h3>Deine hartnäckigsten Baustellen</h3><div style="display:grid;gap:8px">${baustellen}</div></div>
    ${ls.geschafft.length ? `<div><h3>Geschafft ✓</h3><div class="chips-geschafft">${ls.geschafft.map(g => `<span>✓ ${esc(g)}</span>`).join('')}</div></div>` : ''}
    <div><h3>Alle Fertigkeiten</h3><div class="skill-rows">${zeilen}</div></div>
    <div class="spell-row">${training}${planKnopf}</div>${err}${planBox}
  </section>`;
}
let gesamtFehler = '';
async function askGesamt() {
  if (planBusy.has('gesamt')) return;
  const runs = lernstandRuns(), text = lernstandText(lernstand(runs)), stand = lernstandStand(runs);
  planBusy.add('gesamt'); gesamtFehler = ''; render();
  try {
    const plan = (await gesamtFrage(text)).slice(0, 1500);
    if (plan) try { localStorage.setItem(GESAMT_KEY, JSON.stringify({ text: plan, at: Date.now(), stand })); } catch (e) {}
  } catch (err) {
    gesamtFehler = typeof kiFail === 'function' ? kiFail(err) : claudeFail(err);
  }
  planBusy.delete('gesamt');
  if (VIEW === 'menu') render();
}

// --- 🎯 Training: gezielt zu den hartnäckigen Fertigkeiten, zählt nicht für Noten
function trainingPlan(ls) {
  const kinds = [...new Set(ls.hartAlle.map(p => p.skill))].filter(k => TRAIN_KINDS.includes(k));
  const woerter = ls.hartAlle.filter(p => p.wort).map(p => p.wort).concat(ls.woerter.filter(w => ls.muster['spell:' + w.toLowerCase()] && ls.muster['spell:' + w.toLowerCase()].runs.size >= 1)).slice(0, 6);
  return { kinds, woerter: [...new Set(woerter)], total: kinds.length + (ls.hartAlle.some(p => p.wort) ? 1 : 0) };
}
const POOLS = () => ({ vocab: [BASE.VOCAB, VOCAB_EXTRA, VOCAB_MORE], irreg: [BASE.IRREG, IRREG_EXTRA, IRREG_MORE], gap: [BASE.GAPS, GAPS_EXTRA, GAPS_MORE],
  neg: [BASE.NEG, NEG_EXTRA, NEG_MORE], quest: [BASE.QUEST, QUEST_EXTRA, QUEST_MORE], short: [BASE.SHORT, SHORT_EXTRA, SHORT_MORE], trans: [BASE.TRANS, TRANS_EXTRA, TRANS_MORE] });
function trainingSichtbar(kind, it) {
  return plainText([kind === 'irreg' ? it.inf : '', kind === 'gap' ? [it.pre, it.verb, it.post] : '', it.s || '', it.q || '',
    showSol(it, kind), it.en || []].flat(2).join(' '));
}
function trainingVerrat(kind, it, text) {
  return kind === 'vocab' ? verraten(it, text) : (kind === 'irreg' || kind === 'gap') ? forms(it).some(w => wordIn(w, text))
    : kind === 'trans' ? transVerbs(it).some(w => wordIn(w, text)) : false;
}
function startTraining() {
  const runs = lernstandRuns(), ls = lernstand(runs), tp = trainingPlan(ls);
  const benutzt = new Set(), falsch = new Set();
  runs.forEach(r => r.items.forEach(x => { if (x.id) { benutzt.add(x.id); if (!x.ok) falsch.add(x.id); } }));
  ['A', 'B', 'C', 'D', 'E', 'Z'].forEach(k => { const st = readState(k); if (st && st.pick) PICK_LISTS.forEach(L => (st.pick[L] || []).forEach(id => benutzt.add(id))); });
  BASE.VOCAB.concat(BASE.IRREG, BASE.GAPS, BASE.NEG, BASE.QUEST, BASE.SHORT, BASE.TRANS).forEach(it => benutzt.add(it.id));
  const ziel = tp.kinds.length ? tp.kinds : [];
  const proArt = Math.max(2, Math.min(4, Math.ceil(12 / Math.max(1, ziel.length))));
  const wahl = { vocab: [], irreg: [], gap: [], neg: [], quest: [], short: [], trans: [] };
  let text = menuText() + ' ' + plainText(tp.woerter.join(' ')), anzahl = 0;
  const nimm = (kind, kandidaten, max) => {
    for (const it of kandidaten) {
      if (wahl[kind].length >= max || anzahl >= 12) break;
      if (wahl[kind].includes(it)) continue;
      const neu = trainingSichtbar(kind, it);
      if (trainingVerrat(kind, it, text)) continue;
      if (Object.entries(wahl).some(([k2, l]) => l.some(x => trainingVerrat(k2, x, neu)))) continue;
      if (kind === 'gap' && wahl.irreg.some(i => i.inf === it.verb)) continue;
      if (kind === 'irreg' && wahl.gap.some(g => g.verb === it.inf)) continue;
      wahl[kind].push(it); anzahl++; text += ' ' + neu;
    }
  };
  const mische = l => { const a = l.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  ziel.forEach(kind => {
    const alle = POOLS()[kind].flat().filter(it => kind !== 'quest' || !it.words || true);
    nimm(kind, mische(alle.filter(it => !benutzt.has(it.id))).concat(mische(alle.filter(it => falsch.has(it.id)))), proArt);
  });
  // mindestens 8 Aufgaben: mit den schwächsten übrigen Fertigkeiten auffüllen
  const rest = TRAIN_KINDS.filter(k => !ziel.includes(k)).sort((a, b) => {
    const q = k => ls.skills[k] ? ls.skills[k].ok / ls.skills[k].n : 1; return q(a) - q(b); });
  for (const kind of rest) { if (anzahl >= 8) break; nimm(kind, mische(POOLS()[kind].flat().filter(it => !benutzt.has(it.id))), Math.min(3, 8 - anzahl)); }
  if (VIEW === 'test') writeState(CUR, S);
  CUR = 'T'; VIEW = 'test'; confirming = null;
  S = Object.assign(fresh(), { at: 'writing', training: true });
  S.pick = { v: 2, story: 'A', VOCAB: wahl.vocab.map(x => x.id), IRREG: wahl.irreg.map(x => x.id), GAPS: wahl.gap.map(x => x.id),
    NEG: wahl.neg.map(x => x.id), QUEST: wahl.quest.map(x => x.id), SHORT: wahl.short.map(x => x.id), TRANS: wahl.trans.map(x => x.id), ORDER: [] };
  const tw = spellWords(tp.woerter);
  if (tw.length) S.spell = { words: tw, i: 0, phase: 'zeigen', ok: [], cur: { tiles: spellMix(tw[0]), placed: [] }, fertig: false };
  if (typeof kiErr !== 'undefined') kiErr.clear();
  applyVariant(); save(); render(); window.scrollTo({ top: 0 });
  if (S.spell) spellTimer();
}
function trainingPrompt(kind, it) {
  return {
    vocab: [esc(it.de), {}], irreg: [`<span class="grid-de">${esc(it.de)}</span> <b>${esc(it.inf)}</b> → %INPUT%`, { inline: true }],
    gap: [`${esc(it.pre)} %INPUT% <small>(${esc(it.verb)})</small> ${esc(it.post)}`, { inline: true }],
    neg: [esc(it.s) + ' <small>(verneinen)</small>', { ph: 'Schreib den ganzen Satz …' }],
    quest: [it.words ? `<small>Wörter:</small> ${esc(it.s)}` : esc(it.s) + ' <small>(als Frage)</small>', { ph: 'Schreib die Frage …' }],
    short: [`${esc(it.q)}<br>${esc(it.yn)} %INPUT%`, { inline: true, ph: '…' }],
    trans: [esc(it.de) + ' <small>(übersetzen)</small>', { ph: 'Schreib den englischen Satz …' }],
  }[kind];
}
function renderTraining() {
  const done = S.done.training;
  let n = 0;
  const items = TRAIN_KINDS.flatMap(kind => (ALL_TYPED[kind] || []).map(it => {
    const [p, o] = trainingPrompt(kind, it);
    return typedItem(it, ++n, kind, p, Object.assign({ section: 'training' }, o));
  })).join('');
  const all = TRAIN_KINDS.flatMap(kind => (ALL_TYPED[kind] || []).map(it => [kind, it]));
  const richtig = all.filter(([, it]) => isRight(S.answers[it.id], it.en, it) || S.claudeOk[it.id]).length;
  return `<div class="train-head"><h2>🎯 Training</h2><p class="task" style="margin:4px 0 0">Gezielt zu deinen hartnäckigen Fehlern. Zählt nicht für Noten.</p></div>
    ${all.length ? `<div class="card"><h3>Aufgaben <span class="pts">${all.length}</span></h3><div class="items">${items}</div>
      <div class="actions">${done ? `<span class="note"><b>${richtig} von ${all.length}</b> richtig – fließt in deinen Lernstand ein.</span>`
        : `<span class="note">Prüfen zeigt dir die Lösungen.</span><button type="button" class="btn" style="background:var(--line-purple)" data-train-submit>✔ Training prüfen</button>`}</div></div>` : ''}
    ${S.spell ? `<div class="card"><h3>Rechtschreibung</h3>${spellBox() || (S.spell.fertig ? `<p class="task">Geübt: ${S.spell.richtig} von ${S.spell.anzahl} richtig.</p>` : '')}</div>` : ''}
    <div class="actions"><span></span><button type="button" class="btn ghost" data-menu>☰ Zurück zum Lernstand</button></div>`;
}
function trainingAbgeben() {
  S.done.training = true; S.doneAt = Object.assign({}, S.doneAt, { training: Date.now() });
  const v = readVerlauf();
  v.push({ test: 'T', label: 'Training', at: Date.now(), items: collectRun('T', S) });
  writeVerlauf(v);
  save(); render();
}
async function gesamtFrage(text) {
  if (!kiOn()) throw { code: 'weg' };
  const r = await kiFrage('lernplan', { modus: 'gesamt', fehler: text }, 30000);
  return String(r && r.plan || '');
}

// ---------------------------------------------------------------------------
// Uhr
// ---------------------------------------------------------------------------
// Die Uhr läuft nur, solange eine Arbeit offen und die Seite sichtbar ist; die Zeit
// wird pro Arbeit aufsummiert (ein Sprung über 5 s – Rechner schlief – zählt nicht).
let lastTick = Date.now();
function tick() {
  const now = Date.now(), dt = Math.min(5, Math.max(0, (now - lastTick) / 1000));
  lastTick = now;
  if (VIEW !== 'test') return;
  if (!document.hidden) S.elapsed = (S.elapsed || 0) + dt;
  showClock();
  if (Math.floor(S.elapsed || 0) % 15 === 0 && !document.hidden) save();
}
function showClock() {
  const s = Math.floor(S.elapsed || 0);
  $('#clock').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
// Beim Wegklicken oder Schließen die gezählte Zeit sichern
document.addEventListener('visibilitychange', () => { lastTick = Date.now(); save(); });
window.addEventListener('pagehide', () => save());
applyVariant();
setInterval(tick, 1000);
tick();
render();
</script>
