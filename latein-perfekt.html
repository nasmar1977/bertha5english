<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Latein: Perfekt-Baukasten</title>
<!-- Latein Kl. 6, „Perfekt-Baukasten“: das Perfekt Aktiv als System – zwei Stämme pro Verb, ein Satz Endungen,
     sechs Wege zum Perfektstamm. Stoff und Begriffe nach dem Buch (Grammatik Lektion 8 B und 9 B), Wortschatz:
     alle Verben der Lektionen 1–10 aus dem Vokabelheft (Lektion 2 von den Heft-Fotos, sie fehlt in index.html).
     Drei Teile: Verstehen (sechs Stationen mit Kurz-Check an späteren Tagen), Üben (sechs Übungsarten),
     Tabellen (elf Blätter zum Drucken).
     Die Verbdaten prüft tools/perfekt-check.mjs gegen das Vokabelheft in index.html; das PDF der Tabellen
     erzeugt tools/perfekt-pdf.py aus dieser Seite (?druck=1). Speicher: localStorage „latein-perfekt-v1“. -->
<style>
:root{
  --bg:#f3f4f1; --paper:#ffffff; --ink:#1c2321; --muted:#5d6763; --line:#d6dad4;
  --acc:#2c6b5a; --acc-soft:#dcefe8; --ton:#a8491f; --ton-soft:#f8e3d6; --blau:#2f5d9c; --blau-soft:#dfe8f6;
  --ok:#2e7d4f; --ok-soft:#dff1e6; --bad:#b3372e; --bad-soft:#f8e1de; --mark:#fff0a8;
  --wv:#2f5d9c; --wu:#2c6b5a; --ws:#b4532a; --wd:#7a4fa3; --wr:#b3375f; --wo:#5d6763; --wx:#8a6d1f;
  --display:"Trebuchet MS", system-ui, sans-serif;
  --body:Verdana, system-ui, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121816; --paper:#1b2321; --ink:#e6ecea; --muted:#9aa7a2; --line:#33403c;
  --acc:#79c7b0; --acc-soft:#1c3a32; --ton:#ec9a6e; --ton-soft:#3f2519; --blau:#8db4ec; --blau-soft:#1d2c42;
  --ok:#6fd39a; --ok-soft:#173a27; --bad:#f08a80; --bad-soft:#42201d; --mark:#453a0a;
  --wv:#8db4ec; --wu:#79c7b0; --ws:#ec9a6e; --wd:#c3a2e8; --wr:#f08fb0; --wo:#9aa7a2; --wx:#d9bd6a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121816; --paper:#1b2321; --ink:#e6ecea; --muted:#9aa7a2; --line:#33403c;
  --acc:#79c7b0; --acc-soft:#1c3a32; --ton:#ec9a6e; --ton-soft:#3f2519; --blau:#8db4ec; --blau-soft:#1d2c42;
  --ok:#6fd39a; --ok-soft:#173a27; --bad:#f08a80; --bad-soft:#42201d; --mark:#453a0a;
  --wv:#8db4ec; --wu:#79c7b0; --ws:#ec9a6e; --wd:#c3a2e8; --wr:#f08fb0; --wo:#9aa7a2; --wx:#d9bd6a; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:860px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px)) 64px}
h1,h2,h3{font-family:var(--display);line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:clamp(1.7rem,5.5vw,2.5rem)}
h2{font-size:1.4rem}
h3{font-size:1.1rem}
p{margin:0}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar .in{max-width:860px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar a,.linkbtn{color:var(--acc);text-decoration:none;font-size:.9rem;background:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;font-family:inherit;min-height:40px;display:inline-flex;align-items:center}
@media (max-width:560px){.bar .crumb{display:none}}
.bar .crumb{color:var(--muted);font-size:.85rem;margin-left:auto}
header.top{padding:28px 0 8px;display:grid;gap:8px}
.eyebrow{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.88rem}
section{margin-top:28px;display:grid;gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:12px;min-width:0}
.card>*{min-width:0}
button{font:inherit;cursor:pointer;color:inherit}
button,.opt,.chip{touch-action:manipulation}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-weight:700;min-height:44px;text-decoration:none;display:inline-flex;align-items:center}
:root[data-theme="dark"] .btn:not(.ghost){color:#0f1518}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn:not(.ghost){color:#0f1518}}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:400}
.btn.gross{font-size:1.05rem;padding:14px 22px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mitte{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;text-align:center}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:left;color:var(--ink);display:grid;gap:4px;align-content:start}
.tile b{font-size:1rem}
.tile span{font-size:.85rem;color:var(--muted)}
.tile .sterne{color:#e2a400;font-size:1.05rem}
a.tile{text-decoration:none}
.tile.done{border-color:var(--ok)}
.tile .tag{justify-self:start}
.tile.next{border:2px solid var(--acc)}
.tag{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:999px;background:var(--blau-soft);color:var(--blau);vertical-align:middle}
.sterne{color:#e2a400;letter-spacing:2px;font-size:1.05rem}
.sterne i{font-style:normal;color:var(--line)}
.meter{height:8px;border-radius:4px;background:var(--acc-soft);overflow:hidden}
.meter i{display:block;height:100%;background:var(--acc)}
.anzeige{display:flex;gap:8px;flex-wrap:wrap}
.anzeige span{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:.92rem;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.seg button{border:0;background:var(--bg);padding:7px 12px;min-height:40px;font-size:.9rem;white-space:nowrap}
.seg button.on{background:var(--acc);color:#fff;font-weight:700}
:root[data-theme="dark"] .seg button.on{color:#0f1518}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button.on{color:#0f1518}}

/* Aufgaben */
.q{font-size:1.05rem}
.q b{color:var(--acc)}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts.liste{display:grid}
.opts.liste .opt{border-radius:10px}
.opt{border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;background:var(--bg);color:var(--ink);font-size:.95rem;min-height:44px;min-width:48px;text-align:left}
.opts.mitte .opt{text-align:center}
.opt.sel{border-color:var(--acc);background:var(--acc-soft);font-weight:700}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.fehlt{border:2px dashed var(--ok)}
.opt:disabled{cursor:default;opacity:1}
.opt.blass:disabled{opacity:.5}
.fb{display:grid;gap:10px}
.msg{padding:10px 12px;border-radius:8px;font-size:.95rem}
.msg.ok{background:var(--ok-soft);border-left:4px solid var(--ok)}
.msg.no{background:var(--bad-soft);border-left:4px solid var(--bad)}
.msg.tipp{background:var(--mark);border-left:4px solid var(--ton)}
.progress{display:flex;gap:6px;align-items:center;font-size:.85rem;color:var(--muted);flex-wrap:wrap}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ok)}
.dots i.jetzt{background:var(--acc)}
.dots i.falsch{background:var(--bad)}
.gross{font-family:var(--display);font-size:1.8rem;font-weight:700;text-align:center;padding:6px 0;overflow-wrap:anywhere}
.cue{text-align:center}
.merk{background:var(--acc-soft);border-radius:10px;padding:12px 14px;font-size:.95rem}
.achtung{background:var(--mark);border-radius:10px;padding:10px 14px;font-size:.95rem}
.msatz{font-size:1.05rem;line-height:2}
.gap{display:inline-block;min-width:3.2em;text-align:center;border-bottom:2px solid var(--line);padding:0 6px;border-radius:4px}
.gap.dran{background:var(--mark);border-color:var(--acc)}
.gap.voll{background:var(--ok-soft);border-color:var(--ok);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--bg);border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;min-height:44px;font-weight:700}
.chip.on{border-color:var(--acc);background:var(--acc-soft)}
.chip.en{font-family:var(--display);font-size:1.1rem;color:var(--acc);border-color:var(--acc)}
.chip:disabled{opacity:.35;cursor:default}
.chip.wackel{animation:wackel .35s;border-color:var(--bad)}
@keyframes wackel{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
@media (prefers-reduced-motion:reduce){.chip.wackel{animation:none}}
.einrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
.ein{font:inherit;font-family:var(--display);font-size:20px;font-weight:700;min-height:48px;padding:6px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:min(100%,14em)}
.ein.ok{border-color:var(--ok);background:var(--ok-soft)}
.ein.no{border-color:var(--bad);background:var(--bad-soft)}
.makron{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.einhinw:empty{display:none}
.makron button{min-width:44px;min-height:40px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);font-family:var(--display);font-weight:700;font-size:1.05rem}
.paare{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.paare .opt{width:100%;border-radius:10px;text-align:center;min-height:48px;font-family:var(--display);font-weight:700;font-size:1.05rem}

/* Bausteine: Stamm (blau) · Zeichen (orange) · Endung (grün) */
.lat{font-family:var(--display);font-weight:700;white-space:nowrap}
.lat .zn,.lat .hl{color:var(--ton)}
.lat .en{color:var(--acc)}
.bau{display:inline-flex;gap:4px;align-items:stretch;font-family:var(--display);font-weight:700;font-size:1.35rem;vertical-align:middle;max-width:100%}
.bau.gross{font-size:1.7rem;padding:0}
.bau.klein{font-size:1.05rem}
.bk{display:grid;gap:1px;justify-items:center;align-content:center;padding:5px 9px;border-radius:8px;border:2px solid var(--line);min-width:1.5em;background:var(--bg)}
.bau.klein .bk{padding:2px 6px;border-width:1.5px}
.bk.st{background:var(--blau-soft);border-color:var(--blau)}
.bk.zn{background:var(--ton-soft);border-color:var(--ton);color:var(--ton)}
.bk.en{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}
.bk.pe{background:var(--bg);border-color:var(--muted)}
.bk.leer{border-style:dashed;color:var(--muted);background:transparent}
.bk .hl{color:var(--ton)}
.psw{display:inline-grid;gap:2px;justify-items:center;align-content:start}
.psi{display:inline-flex;gap:4px;align-items:stretch}
.psw>small{font-family:var(--body);font-weight:400;font-size:.68rem;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);white-space:nowrap;border-top:2px solid var(--line);width:100%;text-align:center;padding-top:1px}
.legende{display:flex;gap:8px 14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);align-items:center}
.wtag{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.75rem;font-weight:700;color:#fff;white-space:nowrap;vertical-align:middle}
/* farbige Flächen auch dann drucken, wenn „Hintergrundgrafiken“ im Druckdialog aus ist – sonst stünde weiße Schrift auf weißem Papier */
.wtag,.gnr,.balken i,.regel,.achtung,.kn,.stp{-webkit-print-color-adjust:exact;print-color-adjust:exact}
:root[data-theme="dark"] .wtag{color:#0f1518}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .wtag{color:#0f1518}}
.w-v{background:var(--wv)}.w-u{background:var(--wu)}.w-s{background:var(--ws)}.w-d{background:var(--wd)}.w-r{background:var(--wr)}.w-o{background:var(--wo)}.w-x{background:var(--wx)}
.balken{display:flex;height:28px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.balken i{display:grid;place-items:center;font-style:normal;font-size:.78rem;font-weight:700;color:#fff;min-width:0;overflow:hidden}
:root[data-theme="dark"] .balken i{color:#0f1518}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .balken i{color:#0f1518}}
.krow{display:grid;gap:4px}
.wege{display:grid;gap:8px}
.weg{border:1px solid var(--line);border-left:6px solid var(--wv);border-radius:8px;padding:8px 12px;display:grid;gap:4px;background:var(--bg)}
.weg.w-v,.weg.w-u,.weg.w-s,.weg.w-d,.weg.w-r,.weg.w-o,.weg.w-x{background:var(--bg)}
.weg.w-u{border-left-color:var(--wu)}.weg.w-s{border-left-color:var(--ws)}.weg.w-d{border-left-color:var(--wd)}.weg.w-r{border-left-color:var(--wr)}.weg.w-o{border-left-color:var(--wo)}.weg.w-x{border-left-color:var(--wx)}

/* Tabellenblätter (Bildschirm und Druck) */
.tabwrap{overflow-x:auto}
.blatt{display:grid;gap:12px}
.blatt .kopf{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap;border-bottom:3px solid var(--wv);padding-bottom:6px}
.blatt.b-u .kopf{border-color:var(--wu)}.blatt.b-s .kopf{border-color:var(--ws)}.blatt.b-d .kopf{border-color:var(--wd)}.blatt.b-r .kopf{border-color:var(--wr)}.blatt.b-o .kopf{border-color:var(--wo)}.blatt.b-x .kopf{border-color:var(--wx)}.blatt.b-n .kopf{border-color:var(--ink)}
.blatt .kopf .wo{font-size:.8rem;color:var(--muted)}
.regel{background:var(--acc-soft);border-radius:10px;padding:10px 14px;display:grid;gap:6px}
table.k6{border-collapse:collapse;font-size:1.02rem}
table.k6 td{padding:1px 18px 1px 0}
table.k6 td.i{padding-top:4px;font-size:.9rem}
table.pt{border-collapse:collapse;width:100%;font-size:.93rem}
table.pt th,table.pt td{border-bottom:1px solid var(--line);padding:8px 8px 8px 0;text-align:left;vertical-align:top}
table.pt th{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;white-space:nowrap}
table.pt td.l{font-family:var(--display);font-weight:700;white-space:nowrap}
table.pt td.z{text-align:right;color:var(--muted);font-size:.82rem;white-space:nowrap}
table.pt td.n{font-size:.85rem;color:var(--muted)}
table.pt tr.grp td{border-bottom:0;padding-top:12px;font-weight:700;font-family:var(--display)}
ul.kompakt{list-style:none;margin:0;padding:0;columns:2;column-gap:28px;font-size:.93rem}
ul.kompakt li{break-inside:avoid;padding:7px 0;border-bottom:1px solid var(--line)}
ul.kompakt .de{color:var(--muted);font-size:.85rem}
.sicher{color:var(--ok);font-size:.8rem}
.fuss{font-size:.8rem;color:var(--muted)}
.ausn{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.ausn .box{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;gap:4px;break-inside:avoid}
.ausn .box h4{margin:0;font-size:.92rem;font-family:var(--body);font-weight:400}
.ausn .box h4 b{font-family:var(--display);font-size:1rem}
ul.az{list-style:none;margin:0;padding:0;columns:3;column-gap:22px;font-size:.84rem}
ul.az li{break-inside:avoid;padding:1px 0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:2px 6px}
ul.az li>span:first-child{flex:1 1 0;min-width:0}
ul.az li .detail{flex-basis:100%}
ul.az .lat{white-space:normal}
@media (max-width:700px){ul.az{columns:1}ul.kompakt{columns:1}}

/* Lernstufen: 1 fett · 2 normal · 3 grau */
.p2 .lat,table.pt tr.p2 td.l,.box.p2 h4 b{font-weight:400}
.p3,.p3 td,.p3 .de{color:var(--muted)}
.p3 .lat,table.pt tr.p3 td.l,.box.p3 h4 b{font-weight:400}
.p3 .lat .zn,.p3 .lat .hl,.p3 .lat .en{color:inherit}
#blatt [data-v]{cursor:pointer}

/* Stammbaum: Verb → zwei Stämme → drei Zeiten → sechs Personen */
.baum{overflow-x:auto;padding:2px 0 6px}
.baum ul{display:flex;justify-content:center;margin:0;padding:18px 0 0;list-style:none;position:relative}
/* mittig, solange er passt; sonst beginnt er links und lässt sich schieben (statt links abgeschnitten zu sein) */
.baum>ul{padding-top:0;width:max-content;margin:0 auto}
.baum ul>li{position:relative;padding:18px 3px 0;display:flex;flex-direction:column;align-items:center}
.baum ul>li::before,.baum ul>li::after{content:"";position:absolute;top:0;right:50%;width:50%;height:18px;border-top:2px solid var(--muted)}
.baum ul>li::after{right:auto;left:50%;border-left:2px solid var(--muted)}
.baum ul>li:only-child::before,.baum ul>li:only-child::after{display:none}
.baum ul>li:only-child{padding-top:0}
.baum ul>li:first-child::before,.baum ul>li:last-child::after{border:0 none}
.baum ul>li:last-child::before{border-right:2px solid var(--muted);border-radius:0 8px 0 0}
.baum ul>li:first-child::after{border-radius:8px 0 0 0}
.baum ul ul::before{content:"";position:absolute;top:0;left:50%;border-left:2px solid var(--muted);height:18px}
.kn{border:2px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--paper);display:grid;gap:1px;justify-items:center;text-align:center}
.kn b{font-family:var(--display);font-size:1.1rem}
.kn small{font-size:.72rem;color:var(--muted);line-height:1.25}
.kn.verb{border-color:var(--ink)}
.kn.ps{border-color:var(--blau);background:var(--blau-soft)}
.kn.pfs{border-color:var(--ton);background:var(--ton-soft)}
.kn .hinw{max-width:11em}
.kn.zeit{padding:6px 4px}
.kn.zeit>b{font-size:.9rem}
.frs{display:grid;gap:1px;justify-items:start;margin-top:3px}
.fr{padding:4px 4px;border-radius:5px;font-size:.92rem;cursor:pointer;white-space:nowrap}
.fr.an{background:var(--mark)}
.fr .pn{display:inline-block;width:2.3em;font-size:.72rem;color:var(--muted);text-align:left}
.lat .pe{color:var(--muted)}

/* Weg zum Perfektstamm, Schritt für Schritt */
.pfad{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.stpw{display:flex;gap:6px;align-items:stretch}
.stp{border:1.5px solid var(--line);border-radius:8px;padding:5px 10px;display:grid;gap:2px;background:var(--bg);max-width:15em;align-content:start}
.stp .lat{font-size:1.1rem}
.stp s,.pz s{color:var(--muted);font-weight:400}
.stp small{font-size:.8rem;color:var(--muted);line-height:1.3}
.stp.ziel{border-color:var(--ton);background:var(--ton-soft)}
.stp.end{border-color:var(--acc);background:var(--acc-soft)}
.pfeil{align-self:center;color:var(--muted);font-weight:700}
.pz{line-height:1.9}

/* Untergruppen der Tabellen */
.gruppe{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:8px}
.gruppe.spaeter{border-style:dashed}
.gruppe h3{font-size:1.02rem}
.gruppe h3 small{font-family:var(--body);font-weight:400;font-size:.8rem;color:var(--muted)}
.gruppe h4{margin:4px 0 0;font-size:.88rem;font-family:var(--body)}
.gnr{display:inline-block;min-width:2em;text-align:center;border-radius:6px;padding:0 6px;color:#fff;font-size:.85rem}
:root[data-theme="dark"] .gnr{color:#0f1518}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .gnr{color:#0f1518}}
.bspweg{display:grid;gap:10px}
.gpaar{display:grid;gap:12px}
.reihen{display:grid;gap:4px}

// Begründung zu einer bestimmten Form. esse, posse und ihre Verwandten haben eigene Präsensformen und ein Imperfekt ohne -ba-.
const zeitGrund = (v, z, p, f) => z === 'pf' ? `Perfektstamm ${L(v.ps + '-')} und Perfekt-Endung ${L('-' + ENDEN[p])}.`
  : v.k === 'x' && z === 'pr' ? `Das Präsens von ${v.inf} ist unregelmäßig: ${L(praes(v).slice(0, 3).join(', ') + ' …')}`
  : IMPF_X[v.inf] ? `Das Imperfekt von ${v.inf} hat kein -ba-: ${L(impf(v).slice(0, 3).join(', ') + ' …')}`
  : z === 'pr' ? 'Präsensstamm und normale Endung.' : `Das Zeichen ${L(v.k === 'a' || v.k === 'e' ? '-ba-' : '-ēba-')} verrät das Imperfekt.`;
function s3Zeiten() {
  const pool = VERBEN.filter(v => v.kern && v.k !== 'x'), out = [];
  for (const z of shuffle(['pr', 'im', 'pf', 'pr', 'im', 'pf'].concat([0, 1, 2].map(() => pick(['pr', 'im', 'pf']))))) {
    for (let n = 0; n < 80; n++) {
      const v = pick(pool), p = rnd(0, 5), f = (z === 'pr' ? praes(v) : z === 'im' ? impf(v) : perf(v))[p];
      // kein Verb doppelt, keine Zwillinge (die kommen im nächsten Schritt)
      if (out.some(x => x.v === v) || alleFormen(v).filter(x => ohneM(x.f) === ohneM(f)).length > 1) continue;
      out.push({ v, h: f, c: ['pr', 'im', 'pf'].indexOf(z), sub: `von ${v.inf} (${esc(v.de)})`, e: zeitGrund(v, z, p, f) });

}
// Formenpaare Präsens/Perfekt derselben Person; c: 0 nur Präsens, 1 nur Perfekt, 2 beides; zw = nur der Strich unterscheidet
function paareListe(namen, personen) {
  const alle = [];
  for (const inf of namen) {
    const v = vb(inf), pr = praes(v), pf = perf(v), sub = `von ${v.inf} (${esc(v.de)})`;
    for (const p of personen) {
      const key = inf + p;
      if (pr[p] === pf[p]) alle.push({ key, h: pr[p], sub, c: 2, e: `Bei ${v.inf} sind Präsensstamm und Perfektstamm gleich – und die Endung ${L('-' + PEND[p])} gibt es in beiden Zeiten.` });
      else {
        const zw = ohneM(pr[p]) === ohneM(pf[p]), z = zw ? ' Nur der Längenstrich macht den Unterschied!' : '';
        alle.push({ key, h: pr[p], sub, c: 0, zw, e: `Präsens. Das Perfekt heißt ${L(pf[p])}.${z}` }, { key, h: pf[p], sub, c: 1, zw, e: `Perfekt. Das Präsens heißt ${L(pr[p])}.${z}` });
      }
    }
  }
  return alle;
}
// nach Plan auswählen: [[Filter, Anzahl], …]. Von einem Paar (Verb + Person) kommt höchstens eine Form dran –
// sonst hätte die Erklärung zur ersten die Lösung der zweiten schon genannt.
function waehle(alle, plan) {
  const out = [], keys = new Set();
  for (const [f, n] of plan) { let k = 0; for (const x of shuffle(alle.filter(f))) { if (k >= n) break; if (keys.has(x.key)) continue; keys.add(x.key); out.push(x); k++; } }
  return shuffle(out);
}

  return `<div class="blatt b-x">${kopf('Tabelle 7: Die 7 fürs Kopfkissen', 'x')}

    <div class="gruppe"><h3><span class="gnr w-x">7a</span> ${GR.x1.t}</h3><p><b>Regel:</b> ${GR.x1.r}</p><div class="ausn">${vs.filter(v => v.g === 'x1').map(v => ausBox(v, opt)).join('')}</div></div>
    <div class="gruppe"><h3><span class="gnr w-x">7b</span> ${GR.x2.t}</h3><p><b>Regel:</b> ${GR.x2.r}</p><div class="ausn">${vs.filter(v => v.g === 'x2').map(v => ausBox(v, opt)).join('')}</div></div>
    <div class="gruppe spaeter"><h3>Wird später gelernt</h3><p class="small">Diese vier Verben aus Lektion 1–9 fehlen in den Tabellen. Ihr Perfekt kommt im Buch erst später – warum, steht daneben. <b>Bitte nicht selbst bilden!</b></p>
      <table class="pt">${SPAETER.map(s => `<tr class="p3"><td class="l">${s[0]}, ${s[1]}</td><td>${esc(s[2])} · L${s[3]}</td><td class="n">${s[4]}</td></tr>`).join('')}</table></div>${legende(vs, true)}</div>`;
}
function blattEinzel(opt) {
  const vs = VERBEN.filter(v => v.einzel);
  return `<div class="blatt b-n">${kopf('Einzelfälle mit allen Formen', 'einzel')}
    <p>Diese ${vs.length} Verben passen in keine feste Regel ihrer Tabelle. Deshalb stehen sie hier noch einmal mit allen Formen – zum Einzeln-Lernen. Die Zahl nennt die Tabelle, in der du ihren Weg findest.</p>
    <div class="ausn">${vs.map(v => ausBox(v, opt, true)).join('')}</div>
    <div class="fuss">${WEGE6.filter(t => vs.some(v => v.t === t)).map(t => `<span class="wtag w-${t}">${tabNr(t)}</span> ${WEG[t].k}`).join(' · ')}</div>${legende(vs, true)}</div>`;
}
function blattAZ(opt) {
  return `<div class="blatt b-n">${kopf('Alle Verben von A bis Z', 'az')}
    <p class="small">Zum Nachschlagen: Infinitiv, 1. Person Präsens, <b>1. Person Perfekt</b>. Die Zahl nennt die Tabelle, in der das Verb steht.</p>
    <ul class="az">${sortAZ(VERBEN).map(v => `<li ${vAttr(v)}><span>${L(v.inf)}, ${L(v.pr)}, ${L(v.pf)}</span><span class="wtag w-${v.t}">${tabNr(v.t)}</span></li>`).join('')}</ul>
    <div class="fuss">${TAB.map(t => `<span class="wtag w-${t}">${tabNr(t)}</span> ${WEG[t].k}`).join(' · ')}</div>
    <div class="fuss">Nicht in der Liste: ${SPAETER.map(s => s[0]).join(', ')} – ihr Perfekt lernst du später.</div>${legende(VERBEN, false)}</div>`;
}
function blattEnd() {
  const zeile = i => `<div class="e"><span>${PKURZ[i] === 'er' ? 'er, sie, es' : PKURZ[i]}</span><b>-${PEND[i]}</b></div>`;
  return `<div class="blatt b-n poster">${kopf('Die sechs Perfekt-Endungen', 'end')}
    <p class="gross2">Sie passen an <b>jeden</b> Perfektstamm – bei allen Verben.</p>
    <div class="end6"><div>${[0, 1, 2].map(zeile).join('')}</div><div>${[3, 4, 5].map(zeile).join('')}</div></div>
    <div class="e inf"><span>Infinitiv Perfekt</span><b>-isse</b></div>
    <div class="regel"><div>So findest du den <b>Perfektstamm</b>: Nimm von der 1. Person Perfekt das -ī weg. ${L('dīxī')} → ${L('dīx-')}</div>
      <div>${['rogāre', 'tacēre', 'dīcere', 'vidēre', 'currere', 'contendere', 'esse'].map(inf => pfHtml(vb(inf), 'ī')).join(' · ')}</div>
      <div>${['rogāre', 'tacēre', 'dīcere', 'vidēre', 'currere', 'contendere', 'esse'].map(inf => pfHtml(vb(inf), 'ērunt')).join(' · ')}</div></div>
    <p class="small muted">Zum Aufhängen: an den Kühlschrank, über den Schreibtisch oder neben das Bett.</p></div>`;
}
function blattPlan() {
  const r = vb('rogāre'), n = t => VERBEN.filter(v => v.t === t).length;
  const brecher = k => VERBEN.filter(v => v.k === k && !v.regel).map(v => `${L(v.inf)} (${tabNr(v.t)})`).join(', ');
  return `<div class="blatt b-n">${kopf('Das Perfekt – der Bauplan', 'plan')}
    <h3>1 · Ein Verb, zwei Stämme</h3>
    ${baumHtml(r, -1, { namen: true, hinw: true })}
    <p class="small">Im Vokabelheft stehen deshalb seit Lektion 8 drei Formen, zum Beispiel ${L('putāre, putō, putāvī')}. Die Perfektform ohne -ī ist der Perfektstamm. Nach der Gabel geht es verschieden weiter – aber auf beiden Ästen stehen dieselben sechs Personen.</p>
    <h3>2 · Sieben Tabellen – vom Einfachen zum Schwierigen</h3>
    <div class="tabwrap"><table class="pt"><tr><th>Tabelle</th><th>Was passiert mit dem Stamm?</th><th>Beispiel</th><th>Verben</th></tr>
      ${TAB.map(t => { const v = vb({ o: 'contendere', v: 'rogāre', u: 'tacēre', s: 'dīcere', d: 'vidēre', r: 'currere', x: 'esse' }[t]); return `<tr><td><span class="wtag w-${t}">${tabNr(t)}</span> ${WEG[t].n}</td><td>${{ o: 'nichts – er bleibt gleich', v: 'das Zeichen v kommt dazu', u: 'der letzte Vokal fällt weg, das Zeichen u kommt dazu', s: 'das Zeichen s kommt dazu, Konsonanten verändern sich', d: 'der Vokal im Stamm wird lang', r: 'der Anfang wird verdoppelt', x: 'ganz eigener Stamm – auswendig lernen' }[t]}</td><td class="l">${v.pr} → ${pfHtml(v, 'ī')}</td><td class="z">${n(t)}</td></tr>`; }).join('')}</table></div>
    <h3>3 · Was die Konjugation verrät: die Faustregel</h3>
    <p class="small">Die Konjugation gehört zum Präsensstamm. Für das Perfekt gibt sie nur einen Tipp. Jede Farbe ist ein Weg, die Zahl sagt, wie viele Verben ihn gehen.</p>
    <div class="wege">${faustChart()}</div>
    <p class="small"><b>Regelbrecher</b> (in Klammern die Tabelle): a-Konjugation: ${brecher('a')}. e-Konjugation: ${brecher('e')}. i-Konjugation: ${brecher('i')}.</p></div>`;
}
function blatt(k, opt) {
  opt = opt || {};
  return k === 'plan' ? blattPlan() : k === 'end' ? blattEnd() : k === 'x' ? blattX(opt) : k === 'einzel' ? blattEinzel(opt) : k === 'az' ? blattAZ(opt) : blattWeg(k, opt);
}

// ---------- Drucken ----------
function druckFuellen(keys) { document.getElementById('druck').innerHTML = keys.map(k => blatt(k, { druck: true })).join(''); document.body.classList.add('druckt'); }
function drucken(keys) { druckFuellen(keys); window.print(); }
window.addEventListener('beforeprint', () => { if (!document.body.classList.contains('druckt')) druckFuellen(VIEW === 'tab' ? [TB] : BLAETTER); });
window.addEventListener('afterprint', () => { if (document.body.classList.contains('pdf')) return; document.getElementById('druck').innerHTML = ''; document.body.classList.remove('druckt'); });

function renderTab() {
  app.innerHTML = `<header class="top"><div class="eyebrow">Nachschlagen und Drucken</div><h1>📋 Perfekt-Tabellen</h1>
      <p class="muted">Elf Blätter: der Bauplan, das Endungen-Blatt für den Kühlschrank, sieben Lerntabellen, die Einzelfälle mit allen Formen und eine Liste von A bis Z.</p></header>
    <section><div class="row"><button class="btn" id="dAlle" type="button">🖨️ Alle Blätter drucken</button><a class="btn ghost" href="latein-perfekt-tabellen.pdf" download>⬇️ Als PDF laden</a></div>
      <div class="seg" id="bl">${BLAETTER.map(k => `<button type="button" data-k="${k}" class="${k === TB ? 'on' : ''}">${BLATTKURZ[k]}</button>`).join('')}</div>
      <p class="small muted" id="tipph">Tippe ein Verb an: Dann siehst du seinen Weg zum Perfektstamm und alle Formen.</p>
      <div class="card" id="blatt">${blatt(TB, { bild: true })}</div>
      <div class="row"><button class="btn ghost" id="dEins" type="button">🖨️ Nur dieses Blatt drucken</button><button class="btn ghost" id="hm" type="button">Zur Übersicht</button></div></section>`;
  app.querySelector('#tipph').hidden = !app.querySelector('#blatt [data-v]');   // der Hinweis nur dort, wo sich etwas antippen lässt
  app.querySelectorAll('#bl button').forEach(b => b.onclick = () => { TB = b.dataset.k; render(); });
  app.querySelector('#dAlle').onclick = () => drucken(BLAETTER);
  app.querySelector('#dEins').onclick = () => drucken([TB]);
  app.querySelector('#hm').onclick = () => go('home');
  // Verb antippen: Weg und alle Formen aufklappen
  app.querySelector('#blatt').onclick = e => {
    const el = e.target.closest('[data-v]'); if (!el || e.target.closest('.detail')) return;
    const offen = el.nextElementSibling && el.nextElementSibling.classList.contains('detail') ? el.nextElementSibling : el.querySelector(':scope > .detail');
    if (offen) { offen.remove(); return; }
    const v = vb(el.dataset.v), html = `<div class="small muted">${esc(woher(v))}</div>${el.classList.contains('einz') ? '' : pfadHtml(v)}<div class="small">${formenZeile(v)}</div>${v.n ? `<div class="small muted">${v.n}</div>` : ''}`;
    if (el.tagName === 'TR') el.insertAdjacentHTML('afterend', `<tr class="detail"><td colspan="5">${html}</td></tr>`); else el.insertAdjacentHTML('beforeend', `<div class="detail">${html}</div>`);
  };
}

// ===================================================================
// ÜBERSICHT
// ===================================================================
function renderHome() {
  const offen = SKEYS.find(k => !S.st[k]), sum = SKEYS.reduce((a, k) => a + (S.st[k] || 0), 0), due = faellig();
  const p1 = VERBEN.filter(v => v.arbeit), sicher = p1.filter(v => (S.ok[v.inf] || 0) >= 2).length;
  const status = k => !S.st[k] ? (k === offen ? 'als Nächstes' : 'offen') : `${sterne(S.st[k])} verstanden am ${datumDe(S.dat[k])}${S.chk[k] && S.chk[k].n ? ' · Check ' + '✓'.repeat(Math.min(S.chk[k].n, 3)) : ''}`;
  app.innerHTML = `<header class="top"><div class="eyebrow">Latein · Lektion 1–10</div><h1>🧱 Perfekt-Baukasten</h1>
      <p class="muted">Das Perfekt ist ein Baukasten: ein Perfektstamm und eine von sechs Endungen. Hier lernst du, wie die Teile zusammenpassen – erst das Prinzip, dann alle Verben.</p>
      <div class="anzeige"><span>Sterne: <b>${sum}</b> von ${SKEYS.length * 3}</span><span>Sichere Verben für die Arbeit: <b>${sicher}</b> von ${p1.length}</span></div></header>
    ${due.length ? `<section><div class="card check"><h2>🔁 Weißt du es noch?</h2><p>Kurz-Check zu ${due.length === 1 ? 'einer Station' : due.length + ' Stationen'}, die du schon verstanden hast: ${due.map(k => STATION[k].icon + ' ' + STATION[k].name).join(' · ')}. Das dauert nur ein, zwei Minuten.</p><div class="row"><button class="btn gross" id="chk" type="button">Kurz-Check starten</button></div></div></section>` : ''}
    <section><h2>1 · Verstehen</h2><p class="small muted">Sechs kurze Stationen, jede etwa fünf Minuten. Am besten der Reihe nach – vom Einfachen zum Schwierigen.</p>
      <div class="grid">${SKEYS.map((k, i) => { const s = STATION[k]; return `<button class="tile ${S.st[k] ? 'done' : k === offen ? 'next' : ''}" data-s="${k}" type="button"><b>${s.icon} ${i + 1} · ${s.name}</b><span>${s.hook}</span><span class="tag">${status(k)}</span></button>`; }).join('')}</div></section>
    <section><h2>2 · Üben</h2><div class="grid">${MKEYS.map(m => `<button class="tile" data-m="${m}" type="button"><b>${MODI[m].icon} ${MODI[m].name}</b><span>${MODI[m].hook}</span>${S.best[m] ? `<span class="tag">Runden: ${S.best[m].n} · beste: ${S.best[m].b} %</span>` : ''}</button>`).join('')}</div></section>
    <section><h2>3 · Tabellen</h2><div class="grid"><button class="tile" id="tTab" type="button"><b>📋 Perfekt-Tabellen</b><span>Der Bauplan, sieben Lerntabellen mit festen Regeln, die Einzelfälle und alle Verben von A bis Z – zum Nachschlagen und Drucken.</span></button>
      <button class="tile" id="tEnd" type="button"><b>🧲 Endungen-Blatt</b><span>Die sechs Perfekt-Endungen groß auf einem Blatt – für den Kühlschrank.</span></button>
      <a class="tile" href="latein-perfekt-tabellen.pdf" download><b>⬇️ PDF zum Ausdrucken</b><span>Alle Blätter in einer Datei.</span></a></div></section>
    <section><div class="row"><button class="linkbtn" id="reset" type="button">Fortschritt zurücksetzen</button></div></section>`;
  if (due.length) app.querySelector('#chk').onclick = startCheck;
  app.querySelectorAll('[data-s]').forEach(b => b.onclick = () => startStation(b.dataset.s));
  app.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { UM = b.dataset.m; go('ueben'); });
  app.querySelector('#tTab').onclick = () => go('tab');
  app.querySelector('#tEnd').onclick = () => { TB = 'end'; go('tab'); };
  app.querySelector('#reset').onclick = () => { if (confirm('Wirklich alles zurücksetzen? Sterne, Kurz-Checks und Lernstand gehen verloren.')) { try { localStorage.removeItem(KEY); } catch (e) { /* nichts zu löschen */ } S = laden(); render(); } };
}
function render() {
  sperre();
  document.getElementById('crumb').textContent = VIEW === 'station' && R ? STATION[R.k].name : VIEW === 'ueben' || VIEW === 'runde' ? 'Üben' : VIEW === 'tab' ? 'Tabellen' : VIEW === 'check' ? 'Kurz-Check' : '';
  ({ home: renderHome, station: renderStation, ueben: renderUeben, runde: renderRunde, tab: renderTab, check: renderCheck })[VIEW]();
}
// gehaltene Enter-Taste soll nicht durch die Rückmeldungen rasen
document.addEventListener('keydown', e => { if (e.repeat && e.key === 'Enter') e.preventDefault(); }, true);
document.getElementById('homeBtn').onclick = () => {
  const mittendrin = (VIEW === 'station' && R && !R.fertig && R.i > 0) || (VIEW === 'runde' && U && !U.fertig) || (VIEW === 'check' && C && !C.fertig);
  if (mittendrin && !confirm('Wirklich zur Übersicht? Was du hier gerade machst, zählt dann nicht.')) return;
  R = null; U = null; C = null; go('home');
};
// ?druck=1 zeigt nur die Druckblätter – daraus erzeugt tools/perfekt-pdf.py das PDF
if (new URLSearchParams(location.search).has('druck')) { document.body.classList.add('pdf'); druckFuellen(BLAETTER); }
render();
</script>
