<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Deutsch: Letzter Tag vor der Arbeit</title>
<!-- Deutsch Kl. 6: Satzglieder, Wortarten, Zeichen, Groß/klein und „Wolf“ (Saša Stanišić).
     Eigene Sätze nach Aufbau der Übungsarbeit der Lehrerin. Speicher: localStorage „deutsch-6b-wolf-v1“. -->
<style>
:root{
  --bg:#f4f3f0; --paper:#ffffff; --ink:#1d2226; --muted:#5f676d; --line:#d9d6cf;
  --acc:#2f5d7c; --acc-soft:#dfeaf2; --wolf:#8a5a2b; --wolf-soft:#f3e7d9;
  --ok:#2e7d4f; --ok-soft:#dff1e6; --bad:#b3372e; --bad-soft:#f8e1de; --mark:#fff0a8;
  --display:"Trebuchet MS", system-ui, sans-serif;
  --body:Verdana, system-ui, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13181b; --paper:#1c2327; --ink:#e7ecee; --muted:#9aa6ac; --line:#33403f;
  --acc:#7fb4d6; --acc-soft:#1f3442; --wolf:#e0a86a; --wolf-soft:#3a2b1c;
  --ok:#6fd39a; --ok-soft:#173a27; --bad:#f08a80; --bad-soft:#42201d; --mark:#5a4d12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13181b; --paper:#1c2327; --ink:#e7ecee; --muted:#9aa6ac; --line:#33403f;
  --acc:#7fb4d6; --acc-soft:#1f3442; --wolf:#e0a86a; --wolf-soft:#3a2b1c;
  --ok:#6fd39a; --ok-soft:#173a27; --bad:#f08a80; --bad-soft:#42201d; --mark:#5a4d12; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:820px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px)) 64px}
h1,h2,h3{font-family:var(--display);line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:clamp(1.7rem,5.5vw,2.5rem)}
h2{font-size:1.4rem}
h3{font-size:1.1rem}
p{margin:0}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar .in{max-width:820px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar a,.linkbtn{color:var(--acc);text-decoration:none;font-size:.9rem;background:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;font-family:inherit}
.bar .crumb{color:var(--muted);font-size:.85rem;margin-left:auto}
header.top{padding:28px 0 8px;display:grid;gap:8px}
.eyebrow{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.88rem}
section{margin-top:28px;display:grid;gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:12px;min-width:0}
.card>*{min-width:0}
button{font:inherit;cursor:pointer}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-weight:700;min-height:44px}
:root[data-theme="dark"] .btn{color:#0f1518}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#0f1518}}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:400}
.btn.wolf{background:var(--wolf)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

/* Plan */
.plan{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.plan li{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.plan li.next{border:2px solid var(--acc)}
.plan li .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc);font-weight:700;font-size:.9rem}
.plan li.done .n{background:var(--ok-soft);color:var(--ok)}
.plan li .t{font-weight:700}
.plan li .d{font-size:.85rem;color:var(--muted)}
.plan li .m{font-size:.85rem;color:var(--muted);white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:left;color:var(--ink);display:grid;gap:4px}
.tile b{font-size:1rem}
.tile span{font-size:.85rem;color:var(--muted)}
.tile .meter{margin-top:4px}
.meter{height:8px;border-radius:4px;background:var(--acc-soft);overflow:hidden}
.meter i{display:block;height:100%;background:var(--acc)}

/* Karten-Übung */
.satz{font-size:1.15rem;line-height:1.7}
mark{background:var(--mark);color:inherit;padding:1px 3px;border-radius:3px;font-weight:700}
.luecke{display:inline-block;min-width:4em;border-bottom:2px solid var(--ink);text-align:center}
.frage{font-weight:700}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;background:var(--bg);color:var(--ink);font-size:.95rem;min-height:40px;text-align:left}
.opt.sel{border-color:var(--acc);background:var(--acc-soft);font-weight:700}
.opts.liste{display:grid}
.opts.liste .opt{border-radius:10px}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default;opacity:1}
.fb{display:grid;gap:10px}
.fb .msg{padding:10px 12px;border-radius:8px;font-size:.95rem}
.fb .msg.ok{background:var(--ok-soft);color:var(--ink);border-left:4px solid var(--ok)}
.fb .msg.no{background:var(--bad-soft);color:var(--ink);border-left:4px solid var(--bad)}
.progress{display:flex;gap:6px;align-items:center;font-size:.85rem;color:var(--muted)}
.dots{display:flex;gap:4px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ok)}
.tippbox{display:grid;gap:6px}
.tippbox .row{flex-wrap:nowrap;align-items:flex-start}
.tippbtn{flex:none}
.tipp{font-size:.88rem;color:var(--muted);min-height:1.3em}
.tipps{margin:0;padding:10px 12px 10px 28px;background:var(--acc-soft);border-radius:8px;font-size:.88rem;display:grid;gap:4px}
.tipps[hidden]{display:none}
.merk{background:var(--acc-soft);border-radius:10px;padding:12px 14px;font-size:.95rem}
.merk ul{margin:6px 0 0;padding-left:20px}
.merk li{margin:3px 0}

/* Komma-Lücken */
.ksatz{display:flex;flex-wrap:wrap;align-items:baseline;row-gap:6px;font-size:1.15rem}
.gap{width:26px;height:34px;margin:0 1px;border:1px dashed var(--line);border-radius:6px;background:transparent;color:var(--ink);font-weight:700;font-size:1.2rem;line-height:1;padding:0;vertical-align:baseline}
.gap.on{border-style:solid;border-color:var(--acc);background:var(--acc-soft)}
.gap.miss{border-color:var(--bad);border-style:solid;background:var(--bad-soft)}
.gap.extra{border-color:var(--bad);border-style:solid;background:var(--bad-soft);text-decoration:line-through}
.gap.good{border-color:var(--ok);border-style:solid;background:var(--ok-soft)}
.gap:disabled{cursor:default}

/* Generalprobe */
.timer{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.segs{display:flex;flex-wrap:wrap;gap:10px 6px;align-items:flex-start;line-height:1.4}
.seg{display:inline-grid;gap:4px;justify-items:start}
.seg .w{font-size:1.05rem;padding:0 2px}
.seg .w.b{font-weight:700}
.seg select{font:inherit;font-size:.82rem;max-width:11.5em;padding:4px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.seg select.ok{border-color:var(--ok);background:var(--ok-soft)}
.seg select.no{border-color:var(--bad);background:var(--bad-soft)}
.seg .sol{font-size:.78rem;color:var(--bad)}
.txt{font-size:1.05rem}
.tok{border:0;background:transparent;color:var(--ink);font:inherit;font-size:1.05rem;padding:2px 3px;border-radius:4px;border-bottom:2px solid transparent}
.tok.on{border-bottom-color:var(--acc);background:var(--acc-soft)}
.tok.hit{border-bottom-color:var(--ok);background:var(--ok-soft)}
.tok.extra{border-bottom-color:var(--bad);background:var(--bad-soft);text-decoration:line-through}
.tok.miss{border-bottom:2px dashed var(--bad)}
.tok:disabled{cursor:default}
.radio{display:grid;gap:6px}
.radio label{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border:1px solid var(--line);border-radius:8px}
.radio label.ok{border-color:var(--ok);background:var(--ok-soft)}
.radio label.no{border-color:var(--bad);background:var(--bad-soft)}
.pts{font-size:.85rem;color:var(--muted);white-space:nowrap}
.th{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.score{font-family:var(--display);font-size:1.6rem;font-weight:800}

/* Wolf */
.wolfhead{border-left:5px solid var(--wolf);padding-left:12px}
textarea,input.txtin{width:100%;font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{min-height:90px;resize:vertical}
.beleg{display:grid;grid-template-columns:1fr 5.5em auto;gap:6px;align-items:start}
.beleg .del{min-height:40px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:0 10px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:620px){.cols{grid-template-columns:1fr}}
.beispiel{font-size:.9rem;color:var(--muted);font-style:italic}
.check{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.check li{display:flex;gap:8px;align-items:flex-start;font-size:.95rem}
.check li b{min-width:1.2em}
.check li.ok b{color:var(--ok)}
.check li.no b{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:.82rem;border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--bg)}
.muster{background:var(--wolf-soft);border-radius:10px;padding:14px;display:grid;gap:8px}

/* Spickzettel */
.spick label{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line)}
#spickDruck{display:none}
@media print{
  body{background:#fff;color:#000}
  .bar,#app{display:none!important}
  #spickDruck{display:block;font-size:13pt;padding:10mm}
  #spickDruck h2{margin-bottom:8pt}
  #spickDruck li{margin:6pt 0}
}
</style>
</head>
<body>
<div class="bar"><div class="in">
  <a href="index.html">← Zurück zum Vokabeltrainer</a>
  <button class="linkbtn" id="homeBtn" type="button">📋 Plan</button>
  <span class="crumb" id="crumb"></span>
</div></div>
<main class="wrap" id="app"></main>
<div id="spickDruck"></div>
<script>
'use strict';
// ===================================================================
// SPEICHER
// ===================================================================
const KEY = 'deutsch-6b-wolf-v1';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const blankWolf = () => ({ sort: {}, zer: {}, form: {}, pro: [], contra: [], text: '', lang: false, muster: false });
const blank = () => ({ plan: {}, stat: {}, check: null, wolf: blankWolf(), probe: null, spick: null });
function load() {
  try {
    const o = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (o && typeof o === 'object') { const s = Object.assign(blank(), o); s.wolf = Object.assign(blankWolf(), o.wolf || {}); return s; }
  } catch (e) {}
  return blank();
}
let S = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = s => esc(s).replace(/\[\[_\]\]/g, '<span class="luecke">&nbsp;?&nbsp;</span>').replace(/\[\[(.+?)\]\]/g, '<mark>$1</mark>');

// ===================================================================
// ANTWORTLISTEN
// ===================================================================
const SG = ['Subjekt', 'Prädikat', 'Akkusativobjekt', 'Dativobjekt', 'Präpositionalobjekt',
  'adv. Best. der Zeit (Abz)', 'adv. Best. des Ortes (Abo)', 'adv. Best. des Grundes (Abg)', 'adv. Best. der Art und Weise (Abaw)'];
const [SUBJ, PRAED, AKK, DAT, PRAEP, ZEIT, ORT, GRUND, ART] = SG;
const WA = ['Nomen', 'Verb', 'Adjektiv', 'Adverb', 'Pronomen', 'Artikel', 'Präposition', 'Konjunktion'];
const PR = ['Artikel', 'Personalpronomen', 'Possessivpronomen', 'Demonstrativpronomen', 'Relativpronomen',
  'Reflexivpronomen', 'Fragepronomen', 'Indefinitpronomen', 'Konjunktion'];
const KW = ['Präposition', 'Konjunktion', 'Adjektiv', 'Adverb'];
const AA = ['Ort', 'Zeit', 'Grund', 'Art und Weise'];
const NU = ['nebenordnend', 'unterordnend'];
const KG = ['Aufzählung (Wörter oder Hauptsätze)', 'Nebensatz mit Konjunktion (weil, als, obwohl …)', 'Relativsatz (der, die, das …)'];
const [AUFZ, NS, REL] = KG;

// Tipps zu den Antworten: Frageprobe + Beispiel. Die Beispiele kommen in keiner Aufgabe vor – sie verraten nichts.
const TIPP = {
  [SUBJ]: 'Wer oder was? – „Der Vogel singt.“',
  [PRAED]: 'Das gebeugte Verb, oft zweiteilig – „Wir haben gesungen.“',
  [AKK]: 'Wen oder was? – „Ich rufe meinen Freund an.“',
  [DAT]: 'Wem? – „Ich gebe dem Hund Futter.“',
  [PRAEP]: 'Die Präposition gehört fest zum Verb: Auf wen? Worauf? Woran? – „Ich hoffe auf gutes Wetter.“',
  [ZEIT]: 'Wann? Wie lange? Wie oft? – „Nach dem Essen gehen wir raus.“',
  [ORT]: 'Wo? Wohin? Woher? – „Der Ball liegt hinter dem Sofa.“',
  [GRUND]: 'Warum? Weshalb? – „Vor Freude sprang er hoch.“',
  [ART]: 'Wie? Auf welche Weise? – „Sie spricht leise.“',
  'Nomen': 'Lebewesen, Dinge, Gefühle – großgeschrieben, mit Artikel: der Baum, die Freude',
  'Verb': 'Tätigkeit oder Zustand, wird gebeugt: laufen – ich laufe – er lief',
  'Adjektiv': 'Eigenschaft, steigerbar und beugbar: groß – größer – der große Hund',
  'Adverb': 'Umstand (wo, wann, warum, wie), unveränderlich: hier, damals, daher',
  'Pronomen': 'Steht für ein Nomen oder begleitet es: er, sein, jemand',
  'Artikel': 'Begleiter direkt vor dem Nomen – nur der, die, das, ein, eine: das Auto',
  'Präposition': 'Verhältniswort vor Nomen oder Pronomen: auf, wegen, neben',
  'Konjunktion': 'Bindewort zwischen Wörtern oder Sätzen: oder, sondern, obwohl',
  'Personalpronomen': 'Steht für eine Person oder Sache: ich, du, er, wir, euch',
  'Possessivpronomen': 'Zeigt, wem etwas gehört: mein, dein, unser – „unser Garten“',
  'Demonstrativpronomen': 'Zeigt betont auf etwas: jener, solcher – „Jenes Haus ist alt.“',
  'Relativpronomen': 'Leitet nach einem Komma einen Nebensatz ein, Verb am Ende – „die Blume, die blüht“',
  'Reflexivpronomen': 'Zeigt zurück auf das Subjekt – „Ich freue mich.“',
  'Fragepronomen': 'Fragt nach etwas – „Was machst du?“, „Welcher Bus fährt?“',
  'Indefinitpronomen': 'Unbestimmte Person oder Menge: jemand, niemand, alle, einige',
  'kein Pronomen (Adjektiv)': 'Eigenschaftswort, das man beugen kann: der alte, die alte, das alte …',
  'Ort': 'Wo? Wohin? – hier, überall, hinten',
  'Zeit': 'Wann? Wie lange? – jetzt, gestern, nie',
  'Grund': 'Warum? – deswegen, daher',
  'Art und Weise': 'Wie? – anders, so, vergebens',
  'nebenordnend': 'Der Satz danach bleibt normal – „…, sondern ich bleibe hier.“',
  'unterordnend': 'Das Verb rutscht ans Ende – „…, obwohl ich müde war.“',
  [AUFZ]: '„Ich mag Hunde, Katzen und Pferde.“',
  [NS]: '„Wir spielten weiter, obwohl es spät war.“',
  [REL]: '„Das Lied, das wir singen, ist neu.“',
  'Behauptung': 'Was willst du zeigen? Der erste Satz eines Arguments.',
  'Beleg': 'Was passiert im Buch? Die Textstelle, am besten mit Seite.',
  'Erklärung': 'Was zeigt die Textstelle? Was kann man daraus schließen?',
  'Kein Beleg': 'Keine Textstelle aus dem Roman – nur eine Meinung oder ein allgemeiner Satz.'
};
// Groß/klein: Tipp hängt an der Schreibweise, nicht am Wort
const TIPP_GROSS = 'Großgeschrieben, wenn ein Signalwort davorsteht: das, beim, zum, etwas, nichts, alles – „Das Tanzen macht Spaß.“';
const TIPP_KLEIN = 'Kleingeschrieben als Verb oder als Adjektiv vor einem Nomen – „Ich will tanzen.“, „das bunte Bild“';
const tippText = (o, it) => TIPP[o] || (it && it.st === 'E' ? (o[0] === o[0].toUpperCase() ? TIPP_GROSS : TIPP_KLEIN) : '');
const tippAttr = (o, it) => { const t = tippText(o, it); return t ? ` title="${esc(t)}" data-h="${esc(o)}" data-tt="${esc(t)}"` : ''; };
// unter jede Antwortgruppe mit Tipps: Zeile für Hover/Fokus und ein Knopf, der alle Tipps aufklappt (für iPad ohne Hover)
function tippsAn(host) {
  host.querySelectorAll('.opts').forEach(g => {
    const hs = [...g.querySelectorAll('.opt[data-h]')].map(b => b.dataset.h);
    if (!hs.length || (g.nextElementSibling && g.nextElementSibling.classList.contains('tippbox'))) return;
    const box = document.createElement('div'); box.className = 'tippbox';
    const tts = [...g.querySelectorAll('.opt[data-h]')].map(b => b.dataset.tt);
    box.innerHTML = `<div class="row"><button type="button" class="linkbtn tippbtn">💡 Tipps</button><span class="tipp" aria-live="polite"></span></div>
      <ul class="tipps" hidden>${hs.map((h, i) => `<li><b>${esc(h)}:</b> ${esc(tts[i])}</li>`).join('')}</ul>`;
    g.after(box);
    const zeile = box.querySelector('.tipp'), liste = box.querySelector('.tipps');
    box.querySelector('.tippbtn').onclick = () => { liste.hidden = !liste.hidden; };
    const zeig = e => { const b = e.target.closest('.opt[data-h]'); if (b) zeile.innerHTML = `<b>${esc(b.dataset.h)}:</b> ${esc(b.dataset.tt)}`; };
    g.addEventListener('mouseover', zeig); g.addEventListener('focusin', zeig);
    g.addEventListener('mouseleave', () => { zeile.textContent = ''; });
  });
}

// ===================================================================
// STATIONEN – eigene Sätze, nach den Fehlern in der Übungsarbeit gewichtet
// ===================================================================
const ST = {
  A: {
    name: 'Satzglieder', icon: '🧩', sub: 'Frageproben: wem, wen, auf wen, wo, wann …',
    q: 'Welches Satzglied ist markiert?',
    merk: [
      'Zuerst das Prädikat (Verb) suchen, dann mit der Frageprobe weiter.',
      'Wer oder was? → Subjekt. Wen oder was? → Akkusativobjekt. Wem? → Dativobjekt.',
      'Gehört die Präposition fest zum Verb (warten auf, sich freuen über, denken an)? → Präpositionalobjekt. Frage: Auf wen? Worüber? Woran?',
      'Kann man die Präposition austauschen (auf / unter / neben dem Tisch, vor / nach dem Essen)? → adverbiale Bestimmung, kein Objekt. Die Art bestimmst du mit wo? wohin? wann? warum?',
      'Wann? → Zeit (Abz). Wo? → Ort (Abo). Warum? → Grund (Abg). Wie? → Art und Weise (Abaw).',
      'Verben mit Dativ: begegnen, helfen, danken, gehorchen, gefallen – „seiner Freundin begegnen“ ist ein Dativobjekt.'
    ],
    items: [
      { s: 'Lena begegnet [[ihrem Lehrer]] im Supermarkt.', a: DAT, e: 'Wem begegnet Lena? – Ihrem Lehrer. „Begegnen“ verlangt immer den Dativ.' },
      { s: 'Wir warten schon lange [[auf den Bus]].', a: PRAEP, e: 'Auf wen oder was warten wir? – Auf den Bus. „Warten auf“ gehört fest zusammen, die Präposition kann man nicht austauschen.' },
      { s: 'Die Katze sitzt [[auf dem Dach]].', a: ORT, e: 'Wo sitzt die Katze? – Auf dem Dach. Man könnte auch „unter dem Dach“ oder „neben dem Dach“ sagen – die Präposition ist austauschbar, also adverbiale Bestimmung des Ortes.' },
      { s: 'Der Opa schenkt [[seinem Enkel]] ein Fahrrad.', a: DAT, e: 'Wem schenkt der Opa ein Fahrrad? – Seinem Enkel.' },
      { s: 'Der Opa schenkt seinem Enkel [[ein Fahrrad]].', a: AKK, e: 'Wen oder was schenkt der Opa? – Ein Fahrrad.' },
      { s: '[[Am Nachmittag]] spielen die Kinder Fußball.', a: ZEIT, e: 'Wann spielen die Kinder Fußball? – Am Nachmittag.' },

function go(v) { VIEW = v; if (timerId) { clearInterval(timerId); timerId = null; } render(); window.scrollTo(0, 0); }
function crumb(t) { document.getElementById('crumb').textContent = t || ''; }

const PLAN = [
  { k: 'warm', t: 'Aufwärmen: Was ist es, was macht es?', d: 'Zu jedem Wort zwei Fragen: Wortart und Satzglied', min: 5 },
  { k: 'check', t: 'Kurzer Check', d: 'Zwei Aufgaben aus jeder Station – zeigt, wo es noch hakt', min: 10 },
  { k: 'st1', t: 'Station 1', d: '', min: 10 },
  { k: 'st2', t: 'Station 2', d: '', min: 10 },
  { k: 'pause', t: 'Pause', d: 'Aufstehen, trinken, Fenster auf', min: 5 },
  { k: 'wolf', t: '„Wolf“: Kemi und Jörg – Freunde?', d: 'Belege sortieren, Absatz zerlegen, selbst schreiben', min: 15 },
  { k: 'probe', t: 'Generalprobe', d: 'Mini-Arbeit wie die Übungsarbeit, mit Uhr und Note', min: 20 },
  { k: 'spick', t: 'Spickzettel', d: 'Deine 5 wichtigsten Merksätze – dann ist Schluss', min: 5 }
];
function weakest() {
  const def = ['A', 'B', 'C', 'D', 'E'];
  if (!S.check) return def.slice(0, 2);
  const rate = k => { const r = S.check[k] || [0, 0]; return r[1] ? r[0] / r[1] : 1; };
  return def.slice().sort((a, b) => rate(a) - rate(b) || def.indexOf(a) - def.indexOf(b)).slice(0, 2);
}
function planStep(k) {
  const w = weakest();
  if (k === 'warm') startRun('warm');
  else if (k === 'check') startRun('check');
  else if (k === 'st1') startRun(w[0], 'st1');
  else if (k === 'st2') startRun(w[1], 'st2');
  else go(k);
}

function render() {
  if (VIEW === 'home') return renderHome();
  if (VIEW === 'run') return renderRun();
  if (VIEW === 'pause') return renderPause();
  if (VIEW === 'wolf') return renderWolf();

  if (VIEW === 'spick') return renderSpick();
}

function startRun(kind, planKey) {
  let queue;
  if (kind === 'warm') queue = shuffle(WARM).slice(0, 6);
  else if (kind === 'check') queue = shuffle(ST_KEYS.flatMap(k => shuffle(ST[k].items).slice(0, 2)));
  else queue = shuffle(ST[kind].items);
  RUN = { kind, planKey: planKey || (kind === 'warm' || kind === 'check' ? kind : null), queue, idx: 0, streak: 0, count: 0, right: 0, res: {}, finished: false, showMerk: kind in ST };
  go('run');
}
function runTitle() {
  if (RUN.kind === 'warm') return 'Aufwärmen: Was ist es, was macht es?';
  if (RUN.kind === 'check') return 'Kurzer Check';
  return ST[RUN.kind].icon + ' Station: ' + ST[RUN.kind].name;
}
function merkBox(k) { return `<div class="merk"><b>Merkregeln</b><ul>${ST[k].merk.map(m => `<li>${esc(m)}</li>`).join('')}</ul></div>`; }

function renderRun() {
  crumb(runTitle());
  if (RUN.finished) return renderRunEnd();
  if (RUN.showMerk) {
    app.innerHTML = `<header class="top"><div class="eyebrow">Station</div><h1>${esc(runTitle())}</h1></header>
      ${merkBox(RUN.kind)}
      <p class="muted small">Die Station ist geschafft, wenn du drei Aufgaben hintereinander richtig hast.</p>
      <div class="row"><button class="btn" id="los">Los</button></div>`;
    document.getElementById('los').onclick = () => { RUN.showMerk = false; render(); };
    return;
  }
  const it = RUN.queue[RUN.idx];
  const isSt = RUN.kind in ST;
  const prog = isSt ? `<span>Richtig in Folge:</span><span class="dots">${[0, 1, 2].map(i => `<i class="${i < RUN.streak ? 'on' : ''}"></i>`).join('')}</span>`
    : `<span>Aufgabe ${RUN.idx + 1} von ${RUN.queue.length}</span>`;
  app.innerHTML = `<header class="top"><div class="eyebrow">${esc(runTitle())}</div></header>
    <div class="progress">${prog}${isSt ? '<button class="linkbtn" id="merkAuf" style="margin-left:auto">Merkregeln</button>' : ''}</div>
    <div class="card" id="karte"></div><div id="merkHier"></div>`;
  if (isSt) document.getElementById('merkAuf').onclick = () => { const m = document.getElementById('merkHier'); m.innerHTML = m.innerHTML ? '' : merkBox(RUN.kind); };
  renderCard(it, document.getElementById('karte'), ok => answered(it, ok));
  tippsAn(document.getElementById('karte'));
}

function answered(it, ok) {
  RUN.count++;
  if (ok) { RUN.right++; RUN.streak++; } else RUN.streak = 0;
  if (it.st && it.st !== 'W') {
    const s = S.stat[it.st] || (S.stat[it.st] = { r: 0, n: 0 });
    s.n++; if (ok) s.r++;
  }
  if (RUN.kind === 'check') { const r = RUN.res[it.st] || (RUN.res[it.st] = [0, 0]); r[1]++; if (ok) r[0]++; }
  // falsch beantwortete Aufgabe kommt zwei Karten später noch einmal
  if (!ok && RUN.kind in ST) RUN.queue.splice(Math.min(RUN.idx + 3, RUN.queue.length), 0, it);
  RUN.idx++;
  const isSt = RUN.kind in ST;
  if ((isSt && (RUN.streak >= 3 || RUN.count >= 12)) || RUN.idx >= RUN.queue.length) {
    RUN.finished = true;
    if (RUN.kind === 'check') S.check = RUN.res;
    if (RUN.planKey) S.plan[RUN.planKey] = true;
  }
  save();
  render();
  window.scrollTo(0, 0);
}

  let body = '';
  if (RUN.kind === 'check') {

    body = `<div class="card"><h3>So lief dein Check</h3>

  } else {

      ${RUN.kind in ST && RUN.streak < 3 ? '<p class="muted">Das Thema braucht noch etwas Übung. Lies die Merkregeln noch einmal – sie kommen auch auf deinen Spickzettel.</p>' : ''}</div>`;
  }
  const nextIdx = PLAN.findIndex(p => !S.plan[p.k]);
  app.innerHTML = `<header class="top"><div class="eyebrow">${esc(runTitle())}</div><h1>Geschafft</h1></header>${body}
    <div class="row">${RUN.planKey && nextIdx >= 0 ? `<button class="btn" id="nx">Weiter: ${esc(PLAN[nextIdx].k === 'st1' || PLAN[nextIdx].k === 'st2' ? 'Station ' + ST[weakest()[PLAN[nextIdx].k === 'st1' ? 0 : 1]].name : PLAN[nextIdx].t)}</button>` : ''}
    ${RUN.kind in ST ? '<button class="btn ghost" id="nochmal">Noch eine Runde</button>' : ''}
    <button class="btn ghost" id="hm">Zum Plan</button></div>`;
  const nx = document.getElementById('nx'); if (nx) nx.onclick = () => planStep(PLAN[nextIdx].k);
  const nm = document.getElementById('nochmal'); if (nm) nm.onclick = () => startRun(RUN.kind);
  document.getElementById('hm').onclick = () => go('home');
}

function feedback(host, ok, it, done, extra) {
  const fb = host.querySelector('.fb');
  fb.innerHTML = `<div class="msg ${ok ? 'ok' : 'no'}"><b>${ok ? '✓ Richtig!' : '✗ Leider nicht.'}</b> ${extra || ''}${esc(it.e || '')}</div>
    <div class="row"><button class="btn" id="weiterK">Weiter</button></div>`;
  const b = document.getElementById('weiterK'); b.focus({ preventScroll: true }); b.onclick = () => done(ok);
}
function renderCard(it, host, done) {
  if (it.t === 'doppel') return cardDoppel(it, host, done);
  if (it.t === 'komma') return cardKomma(it, host, done);
  const opts = it.o || (it.st === 'A' ? SG : it.st === 'B' ? PR : WA);
  const q = it.q || (ST[it.st] && ST[it.st].q) || '';
  host.innerHTML = `${it.s ? `<p class="satz">${fmt(it.s)}</p>` : ''}<p class="frage">${esc(q)}</p>
    <div class="opts ${it.lst ? 'liste' : ''}">${shuffleIf(opts, it).map(o => `<button class="opt" data-v="${esc(o)}"${tippAttr(o, it)}>${esc(o)}</button>`).join('')}</div>
    ${it.h ? `<div class="tippbox"><div class="row"><button type="button" class="linkbtn tippbtn">💡 Tipp</button></div><ul class="tipps" hidden><li>${esc(it.h)}</li></ul></div>` : ''}<div class="fb"></div>`;
  const tb = host.querySelector('.tippbox .tippbtn'); if (tb) tb.onclick = () => { const l = host.querySelector('.tippbox .tipps'); l.hidden = !l.hidden; };
  host.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    if (host.dataset.locked) return; host.dataset.locked = '1';
    const ok = b.dataset.v === it.a;
    host.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (x.dataset.v === it.a) x.classList.add('ok'); });
    if (!ok) b.classList.add('no');
    feedback(host, ok, it, done, ok ? '' : 'Richtig ist: <b>' + esc(it.a) + '</b>. ');
  });
}
// feste Antwortlisten (Satzglieder, Pronomen …) bleiben in ihrer Reihenfolge, Satz-Varianten werden gemischt
function shuffleIf(opts, it) { return it.lst ? shuffle(opts) : opts; }

function cardDoppel(it, host, done) {
  const sel = { a1: null, a2: null };
  host.innerHTML = `<p class="satz">${fmt(it.s)}</p>
    <p class="frage">1. Welche Wortart?</p><div class="opts" data-r="a1">${WA.map(o => `<button class="opt" data-v="${esc(o)}"${tippAttr(o)}>${esc(o)}</button>`).join('')}</div>
    <p class="frage">2. Welches Satzglied ist es hier?</p><div class="opts" data-r="a2">${SG.map(o => `<button class="opt" data-v="${esc(o)}"${tippAttr(o)}>${esc(o)}</button>`).join('')}</div>
    <div class="row"><button class="btn" id="pruef" disabled>Prüfen</button></div><div class="fb"></div>`;
  const pb = host.querySelector('#pruef');
  host.querySelectorAll('.opts').forEach(g => g.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    if (host.dataset.locked) return;
    g.querySelectorAll('.opt').forEach(x => x.classList.remove('sel')); b.classList.add('sel');
    sel[g.dataset.r] = b.dataset.v; pb.disabled = !(sel.a1 && sel.a2);
  }));
  pb.onclick = () => {
    host.dataset.locked = '1'; pb.disabled = true;
    let ok = true;
    host.querySelectorAll('.opts').forEach(g => {
      const r = g.dataset.r;
      g.querySelectorAll('.opt').forEach(x => { x.disabled = true; x.classList.remove('sel'); if (x.dataset.v === it[r]) x.classList.add('ok'); else if (x.dataset.v === sel[r]) x.classList.add('no'); });
      if (sel[r] !== it[r]) ok = false;
    });
    feedback(host, ok, it, done);
  };
}

function parseKomma(s) {
  return s.split(' ').map(t => {
    if (t.endsWith('(,)')) return { w: t.slice(0, -3), opt: true };
    if (t.endsWith(',')) return { w: t.slice(0, -1), req: true };
    return { w: t };
  });
}
function kommaRichtig(toks, on) {
  // on[i] = Komma nach Wort i gesetzt; Pflicht muss gesetzt sein, sonst darf nur ein freigestelltes stehen
  let gut = 0, fehler = 0;
  toks.forEach((t, i) => {
    if (t.req) { if (on[i]) gut++; else fehler++; }
    else if (on[i] && !t.opt) fehler++;
  });
  return { gut, fehler, pflicht: toks.filter(t => t.req).length };
}
function kommaHtml(toks, prefix) {
  return toks.map((t, i) => `<span>${esc(t.w)}</span>${i < toks.length - 1 ? `<button type="button" class="gap" data-i="${i}" ${prefix ? `data-k="${prefix}-${i}"` : ''} aria-label="Komma nach ${esc(t.w)}"></button>` : ''}`).join('');
}
function kommaZeigen(host, toks, on) {
  host.querySelectorAll('.gap').forEach(g => {
    const i = +g.dataset.i, t = toks[i]; g.disabled = true;
    if (t.req) { g.textContent = ','; g.classList.add(on[i] ? 'good' : 'miss'); }
    else if (on[i]) { if (t.opt) g.classList.add('good'); else g.classList.add('extra'); }
  });
}
function cardKomma(it, host, done) {
  const toks = parseKomma(it.s), on = {};
  let grund = null;
  host.innerHTML = `<p class="frage">${esc(ST.D.q)}</p><div class="ksatz">${kommaHtml(toks)}</div>
    <p class="frage">Begründung:</p><div class="opts liste">${KG.map(o => `<button class="opt" data-v="${esc(o)}"${tippAttr(o)}>${esc(o)}</button>`).join('')}</div>
    <div class="row"><button class="btn" id="pruef" disabled>Prüfen</button></div><div class="fb"></div>`;
  const pb = host.querySelector('#pruef');
  host.querySelectorAll('.gap').forEach(g => g.onclick = () => { if (host.dataset.locked) return; const i = +g.dataset.i; on[i] = !on[i]; g.classList.toggle('on', on[i]); g.textContent = on[i] ? ',' : ''; });
  host.querySelectorAll('.opt').forEach(b => b.onclick = () => { if (host.dataset.locked) return; host.querySelectorAll('.opt').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); grund = b.dataset.v; pb.disabled = false; });
  pb.onclick = () => {
    host.dataset.locked = '1'; pb.disabled = true;
    const r = kommaRichtig(toks, on);
    kommaZeigen(host, toks, on);
    host.querySelectorAll('.opt').forEach(x => { x.disabled = true; x.classList.remove('sel'); if (x.dataset.v === it.g) x.classList.add('ok'); else if (x.dataset.v === grund) x.classList.add('no'); });
    const ok = !r.fehler && grund === it.g;
    feedback(host, ok, it, done, ok ? '' : 'Richtig: <i>' + esc(it.s) + '</i>' + (it.s.includes('(,)') ? ' (das Komma in Klammern darf stehen, muss aber nicht)' : '') + '. ');
  };
}

function wolfAuswertung(text, lang) {

  const seiten = (text.match(/S\.\s*\d+/g) || []).length;
  const hilfen = ['man erkennt', 'daran wird deutlich', 'daran sieht man', 'was man daran sieht', 'hinweise für', 'daraus kann man schließen', 'daraus, dass', 'lässt sich', 'ableiten', 'zum beispiel', 'z. b.', 'z.b.'].filter(h => t.includes(h)).length;
  const gegen = ['allerdings', 'dagegen spricht', 'gegen eine freundschaft', 'andererseits', 'jedoch', 'auf der anderen seite'].some(h => t.includes(h));
  const fazit = ['insgesamt', 'zusammenfassend', 'abschließend', 'meiner meinung nach', 'ich finde', 'ich denke', 'ich glaube'].some(h => t.includes(h));
  const eigen = EIGEN.filter(e => new RegExp('\\b' + e + '\\b', 'i').test(text)).length;

    [hilfen >= zielH, `Formulierungshilfen benutzt: ${hilfen} (Ziel: ${zielH}) – z. B. „Daran wird deutlich, dass …“`],
    [gegen, 'Gegenseite eingeleitet („Allerdings …“, „Dagegen spricht …“)'],
    [fazit, 'Eigenes Urteil am Ende („Insgesamt …“, „Ich finde …“)'],

}

  if (t.type === 'segs') return t.segs.filter(Array.isArray).reduce((n, s, i) => n + (A[t.id + '-' + i] === s[1] ? 1 : 0), 0);
  if (t.type === 'picks') return t.picks.reduce((n, p, i) => n + (A[t.id + '-' + i] === p.a ? 1 : 0), 0);

  app.querySelectorAll('select[data-typ]').forEach(el => el.onchange = () => { A[el.dataset.typ].typ = el.value; save(); });
  app.querySelectorAll('.gap[data-k]').forEach(g => g.onclick = () => { const k = g.dataset.k; A[k] = !A[k]; save(); g.classList.toggle('on', A[k]); g.textContent = A[k] ? ',' : ''; });
  document.getElementById('abgeben').onclick = () => {
    const leer = PROBE.reduce((n, t) => n + (t.type === 'segs' ? t.segs.filter(Array.isArray).filter((s, i) => !A[t.id + '-' + i]).length : t.type === 'picks' ? t.picks.filter((p, i) => A[t.id + '-' + i] === undefined).length : 0), 0);
    if (!confirm(leer ? `Noch ${leer} Felder sind leer. Trotzdem abgeben?` : 'Arbeit abgeben?')) return;
    P.done = true; P.end = Date.now(); P.punkte = PROBE.reduce((n, t) => n + taskPunkte(t, A), 0);
    S.plan.probe = true; save(); go('probe');
  };
}
function optHtml(opts, v) { return `<option value="">–</option>` + opts.map(o => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join(''); }
function probeTask(t, A, fertig) {
  if (t.type === 'segs') {
    let n = -1;
    return `<div class="segs">${t.segs.map(s => {
      if (s === '|') return '<span style="flex-basis:100%;height:0"></span>';
      if (!Array.isArray(s)) return `<span class="seg"><span class="w">${esc(s)}</span></span>`;
      n++; const k = t.id + '-' + n, v = A[k] || '', opts = s[3] || t.o;
      const cls = fertig ? (v === s[1] ? 'ok' : 'no') : '';
      const wort = s[3] ? '' : `<span class="w ${s[2] ? 'b' : ''}">${esc(s[0])}</span>`;
      return `<span class="seg">${wort}<select data-k="${k}" class="${cls}" ${fertig ? 'disabled' : ''} aria-label="${esc(s[0])}">${optHtml(opts, v)}</select>${fertig && v !== s[1] ? `<span class="sol">${esc(s[1])}</span>` : ''}</span>`;
    }).join('')}</div>`;
  }
  if (t.type === 'picks') {
    return t.picks.map((p, i) => { const k = t.id + '-' + i, v = A[k]; return `${p.q ? `<p class="frage">${esc(p.q)}</p>` : ''}<div class="radio">${p.o.map((o, j) => {
      const cls = fertig ? (j === p.a ? 'ok' : (j === v ? 'no' : '')) : '';
      return `<label class="${cls}"><input type="radio" name="${k}" data-k="${k}" value="${j}" ${v === j ? 'checked' : ''} ${fertig ? 'disabled' : ''}><span>${esc(o)}</span></label>`; }).join('')}</div>`; }).join('');
  }
  if (t.type === 'finden') {
    return `<p class="txt">${findenTokens(t.text).map((x, i) => {
      if (x.p) return '\u0000' + esc(x.w);
      const k = t.id + '-' + i, v = A[k] || {};
      let cls = v.on ? 'on' : '';
      if (fertig) cls = x.a ? (v.on ? 'hit' : 'miss') : (v.on ? 'extra' : '');
      const sel = v.on && (x.a || !fertig) ? `<select data-typ="${k}" ${fertig ? 'disabled' : ''} class="${fertig ? (v.typ === x.a ? 'ok' : 'no') : ''}">${optHtml(t.o, v.typ)}</select>${fertig && v.typ !== x.a ? `<span class="sol">${esc(x.a)}</span>` : ''}` : '';
      const sol = fertig && x.a && !v.on ? `<span class="sol">${esc(x.a)}</span>` : '';
      return (sel || sol) ? `<span class="seg" style="vertical-align:top"><button class="tok ${cls}" data-k="${k}" ${fertig ? 'disabled' : ''}>${esc(x.w)}</button>${sel}${sol}</span>` : `<button class="tok ${cls}" data-k="${k}" ${fertig ? 'disabled' : ''}>${esc(x.w)}</button>`;
    }).join(' ').replace(/ \u0000/g, '')}</p><p class="small muted">Antippen markiert ein Wort, nochmal antippen hebt die Markierung auf. Falsch markierte Wörter kosten einen Punkt.</p>`;
  }
  if (t.type === 'kommas') {
    return t.saetze.map((x, si) => {
      const toks = parseKomma(x.s), pre = t.id + '-' + si;
      let html = `<div class="ksatz">${toks.map((tk, i) => {
        const k = pre + '-' + i, on = !!A[k];
        let cls = on ? 'on' : '', txt = on ? ',' : '';
        if (fertig) { cls = tk.req ? (on ? 'good' : 'miss') : (on ? (tk.opt ? 'good' : 'extra') : ''); if (tk.req) txt = ','; }
        return `<span>${esc(tk.w)}</span>${i < toks.length - 1 ? `<button type="button" class="gap ${cls}" data-k="${k}" ${fertig ? 'disabled' : ''} aria-label="Komma nach ${esc(tk.w)}">${txt}</button>` : ''}`;
      }).join('')}</div>`;
      const gk = pre + '-g', gv = A[gk] || '';
      html += `<div class="seg"><select data-k="${gk}" ${fertig ? 'disabled' : ''} class="${fertig ? (gv === x.g ? 'ok' : 'no') : ''}" aria-label="Begründung">${optHtml(KG, gv)}</select>${fertig && gv !== x.g ? `<span class="sol">${esc(x.g)}</span>` : ''}</div>`;
      return html;
    }).join('<hr style="border:0;border-top:1px solid var(--line);width:100%">');
  }
  return '';
}

// ===================================================================
// SPICKZETTEL
// ===================================================================
const ALLE_MERK = ST_KEYS.flatMap(k => ST[k].merk.map((m, i) => ({ id: k + i, st: k, m })));
function spickVorschlag() {
  const w = weakest();
  const rate = k => { const r = S.stat[k]; return r && r.n ? r.r / r.n : 1; };
  const order = ST_KEYS.slice().sort((a, b) => (w.includes(b) - w.includes(a)) || rate(a) - rate(b));
  const sel = [];
  order.forEach(k => ST[k].merk.slice(0, 3).forEach((_, i) => { if (sel.length < 5 && sel.filter(x => x[0] === k).length < 2) sel.push(k + i); }));
  // Wortart ≠ Satzglied gehört immer drauf – das war der Hauptfehler in der Übungsarbeit
  if (!sel.includes('C0')) sel[4] = 'C0';
  return sel;
}
function renderSpick() {
  crumb('Spickzettel');
  if (!S.spick) { S.spick = { sel: spickVorschlag(), own: '' }; save(); }
  const SP = S.spick;
  app.innerHTML = `<header class="top"><div class="eyebrow">Zum Schluss</div><h1>🗒️ Dein Spickzettel</h1>
    <p class="muted">Fünf Merksätze, die du dir heute Abend noch einmal durchliest. Vorgeschlagen sind die aus deinen schwächsten Stationen – du kannst sie ändern. (Natürlich nicht mit in die Arbeit nehmen 😉)</p></header>
    <div class="card spick">${ST_KEYS.map(k => `<h3>${ST[k].icon} ${esc(ST[k].name)}</h3>${ST[k].merk.map((m, i) => `<label><input type="checkbox" data-id="${k + i}" ${SP.sel.includes(k + i) ? 'checked' : ''}><span>${esc(m)}</span></label>`).join('')}`).join('')}
      <h3>✍️ Eigener Merksatz</h3><textarea id="own" rows="3" placeholder="z. B. Bei „begegnen“ immer: wem?">${esc(SP.own)}</textarea>
      <p class="small muted" id="anz"></p></div>
    <div class="row"><button class="btn" id="druck">Drucken</button><button class="btn ghost" id="fertig">${S.plan.spick ? 'Zum Plan' : 'Fertig für heute'}</button></div>`;
  const anz = () => { document.getElementById('anz').textContent = SP.sel.length + ' ausgewählt' + (SP.sel.length > 5 ? ' – weniger ist mehr, fünf reichen.' : ''); };
  anz();
  app.querySelectorAll('[data-id]').forEach(c => c.onchange = () => { SP.sel = SP.sel.filter(x => x !== c.dataset.id); if (c.checked) SP.sel.push(c.dataset.id); save(); anz(); });
  document.getElementById('own').oninput = e => { SP.own = e.target.value; save(); };
  document.getElementById('druck').onclick = () => {
    const items = ALLE_MERK.filter(x => SP.sel.includes(x.id)).map(x => `<li>${esc(x.m)}</li>`).join('') + (SP.own.trim() ? `<li>${esc(SP.own.trim())}</li>` : '');
    document.getElementById('spickDruck').innerHTML = `<h2>Mein Spickzettel – Deutscharbeit</h2><ol>${items}</ol>`;
    window.print();
  };
  document.getElementById('fertig').onclick = () => { S.plan.spick = true; save(); go('home'); };
}

render();
</script>
