<title>Latein: Klassenarbeit Dezember – AcI und Übersetzen</title>
<script>
// Nachtmodus der Leiste (gimmicks.js, sessionStorage „gimStand“): schon hier setzen. gimmicks.js lädt erst am Seitenende –
// bis dahin stünde die Seite beim Wechsel zwischen den Latein-Seiten kurz im falschen Farbschema da.
try { var gimT = JSON.parse(sessionStorage.getItem('gimStand') || 'null'); if (gimT && (gimT.thema === 'dark' || gimT.thema === 'light')) document.documentElement.setAttribute('data-theme', gimT.thema); } catch (e) {}

<!-- Latein Kl. 6, Klassenarbeit Dezember 2026: AcI-Werkstatt und Übersetzen.
     Stoff und Begriffe nach den Arbeitsblättern der Klasse („Grammatik I, L 9“: Wiederholung AcI, Erweiterungen,
     Zeitverhältnisse GZ/VZ mit Faustregel; „Anleitung für das Übersetzen eines Satzes mit AcI“ in sechs Schritten).
     Die Sätze und Texte hier sind eigene, keine vom Arbeitsblatt; die Übersetzungstexte benutzen nur Wörter vom Blatt
     (Zusage der Klassenlehrerin: Der Text der Arbeit hat diesen Wortschatz). Wortschatz: das Blatt „Textlexikon Lektion 9“
     (ROMA A, S. 67) – dasselbe wie im Set „Klassenarbeit Dezember“ in index.html (dort Vokabeln, Vokabelheft, Spiele).
     Zwei Teile: AcI-Werkstatt (sechs Stationen, sechs Übungsarten, Spickzettel) und Übersetzen (Texte Latein → Deutsch,
     Satz für Satz, mit Nachschlagen, Bausteine-Prüfung und Musterlösung).
     tools/arbeit-check.mjs prüft Wortliste, Sätze und Texte gegen index.html. Speicher: localStorage „latein-arbeit-v1“.
     Punkte, Serie, Konfetti, Schnee, „Gerade da“ und Nachtmodus kommen aus gimmicks.js (Leiste rechts oben). -->
<style>
:root{
  --bg:#f3f4f1; --paper:#ffffff; --ink:#1c2321; --muted:#5d6763; --line:#d6dad4;
  --acc:#2c6b5a; --acc-soft:#dcefe8; --ton:#a8491f; --ton-soft:#f8e3d6; --blau:#2f5d9c; --blau-soft:#dfe8f6;
  --ok:#2e7d4f; --ok-soft:#dff1e6; --bad:#b3372e; --bad-soft:#f8e1de; --mark:#fff0a8;
  --display:"Trebuchet MS", system-ui, sans-serif;
  --body:Verdana, system-ui, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121816; --paper:#1b2321; --ink:#e6ecea; --muted:#9aa7a2; --line:#33403c;
  --acc:#79c7b0; --acc-soft:#1c3a32; --ton:#ec9a6e; --ton-soft:#3f2519; --blau:#8db4ec; --blau-soft:#1d2c42;
  --ok:#6fd39a; --ok-soft:#173a27; --bad:#f08a80; --bad-soft:#42201d; --mark:#453a0a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121816; --paper:#1b2321; --ink:#e6ecea; --muted:#9aa7a2; --line:#33403c;
  --acc:#79c7b0; --acc-soft:#1c3a32; --ton:#ec9a6e; --ton-soft:#3f2519; --blau:#8db4ec; --blau-soft:#1d2c42;
  --ok:#6fd39a; --ok-soft:#173a27; --bad:#f08a80; --bad-soft:#42201d; --mark:#453a0a; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:860px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px)) 64px}
h1,h2,h3{font-family:var(--display);line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:clamp(1.6rem,5.2vw,2.3rem)}
h2{font-size:1.4rem}
h3{font-size:1.1rem}
p{margin:0}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar .in{max-width:860px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar a,.linkbtn{color:var(--acc);text-decoration:none;font-size:.9rem;background:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;font-family:inherit;min-height:40px;display:inline-flex;align-items:center}
.bar .crumb{color:var(--muted);font-size:.85rem;margin-left:auto}
@media (max-width:560px){.bar .crumb{display:none}}
header.top{padding:28px 0 8px;display:grid;gap:8px}
.eyebrow{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.88rem}
section{margin-top:28px;display:grid;gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:12px;min-width:0}
.card>*{min-width:0}
button{font:inherit;cursor:pointer;color:inherit}
button,.opt,.chip{touch-action:manipulation}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-weight:700;min-height:44px;text-decoration:none;display:inline-flex;align-items:center}
:root[data-theme="dark"] .btn:not(.ghost){color:#0f1518}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn:not(.ghost){color:#0f1518}}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:400}
.btn.gross{font-size:1.05rem;padding:14px 22px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mitte{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;text-align:center}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:left;color:var(--ink);display:grid;gap:4px;align-content:start}
.tile b{font-size:1rem}
.tile span{font-size:.85rem;color:var(--muted)}
a.tile{text-decoration:none}
.tile.done{border-color:var(--ok)}
.tile.next{border:2px solid var(--acc)}
.tile.gross{padding:18px;gap:6px}
.tile.gross b{font-family:var(--display);font-size:1.25rem}
.tag{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:999px;background:var(--blau-soft);color:var(--blau);vertical-align:middle;justify-self:start}
.sterne{color:#e2a400;letter-spacing:2px;font-size:1.05rem}
.sterne i{font-style:normal;color:var(--line)}
.anzeige{display:flex;gap:8px;flex-wrap:wrap}
.anzeige span{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:.92rem;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.seg button{border:0;background:var(--bg);padding:7px 12px;min-height:40px;font-size:.9rem;white-space:nowrap}
.seg button.on{background:var(--acc);color:#fff;font-weight:700}
:root[data-theme="dark"] .seg button.on{color:#0f1518}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button.on{color:#0f1518}}

/* Aufgaben */
.q{font-size:1.05rem}
.q b{color:var(--acc)}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts.liste{display:grid}
.opts.liste .opt{border-radius:10px}
.opts.mitte .opt{text-align:center}
.opt{border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;background:var(--bg);color:var(--ink);font-size:.95rem;min-height:44px;min-width:48px;text-align:left}
.opt.sel{border-color:var(--acc);background:var(--acc-soft);font-weight:700}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.fehlt{border:2px dashed var(--ok)}
.opt:disabled{cursor:default;opacity:1}
.fb{display:grid;gap:10px}
.fb:empty{display:none}
.msg{padding:10px 12px;border-radius:8px;font-size:.95rem}
.msg.ok{background:var(--ok-soft);border-left:4px solid var(--ok)}
.msg.no{background:var(--bad-soft);border-left:4px solid var(--bad)}
.msg.tipp{background:var(--mark);border-left:4px solid var(--ton)}
.progress{display:flex;gap:6px;align-items:center;font-size:.85rem;color:var(--muted);flex-wrap:wrap}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ok)}
.dots i.jetzt{background:var(--acc)}
.dots i.falsch{background:var(--bad)}
.gross{font-family:var(--display);font-size:1.7rem;font-weight:700;text-align:center;padding:6px 0;overflow-wrap:anywhere}
.merk{background:var(--acc-soft);border-radius:10px;padding:12px 14px;font-size:.95rem}
.achtung{background:var(--mark);border-radius:10px;padding:10px 14px;font-size:.95rem}
.msatz{font-size:1.05rem;line-height:2.1}
.gap{display:inline-block;min-width:3.2em;text-align:center;border-bottom:2px solid var(--line);padding:0 6px;border-radius:4px}
.gap.dran{background:var(--mark);border-color:var(--acc)}
.gap.voll{background:var(--ok-soft);border-color:var(--ok);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--bg);border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;min-height:44px;font-weight:700}
.chip.on{border-color:var(--acc);background:var(--acc-soft)}
.chip:disabled{opacity:.35;cursor:default}
.wackel{animation:wackel .35s;border-color:var(--bad)!important}
@keyframes wackel{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
@media (prefers-reduced-motion:reduce){.wackel{animation:none}}
.lat{font-family:var(--display);font-weight:700}
.lat .st{color:var(--blau)}
.lat .en{color:var(--ton)}

/* Lateinischer Satz mit den Zeichen vom Arbeitsblatt: Infinitiv unterstrichen, GZ/VZ darüber, A über dem Akkusativ,
   Klammer um den AcI, Kopfverb gelb */
.satz{font-family:var(--display);font-weight:700;font-size:1.3rem;line-height:2.9;text-align:center;overflow-wrap:anywhere;padding-top:4px}
.satz.klein{font-size:1.08rem;line-height:2.6}
.satz .w{display:inline-block;position:relative;font:inherit;line-height:1.3;padding:5px 6px;margin:0 1px;border-radius:8px;border:1.5px solid transparent;background:none;color:inherit}
.satz.tap .w{border-color:var(--line);background:var(--bg);min-height:44px;min-width:40px}
.satz.tap .w.sel{border-color:var(--acc);background:var(--acc-soft)}
.satz .w.inf{text-decoration:underline;text-decoration-color:var(--ton);text-decoration-thickness:3px;text-underline-offset:6px}
.satz .w.kv{background:var(--mark)}
.satz .w[data-l]::before{content:attr(data-l);position:absolute;top:-1.25em;left:50%;transform:translateX(-50%);font-family:var(--body);font-size:.72rem;font-weight:700;color:var(--blau);white-space:nowrap}
.satz .w.inf[data-l]::before{color:var(--ton)}
.satz .kl{color:var(--blau);font-size:1.7rem;font-weight:400;line-height:1}
.satz .punkt{margin-left:-2px}
.satz .fn{font-family:var(--body);font-weight:400;font-size:.7rem;vertical-align:super;color:var(--muted)}
.dt{text-align:center;font-size:1.02rem}
.dt .dass{color:var(--blau);font-weight:700}
.dt .sub{text-decoration:underline;text-decoration-color:var(--blau);text-underline-offset:4px}
.dt .praed{text-decoration:underline;text-decoration-color:var(--ton);text-decoration-thickness:3px;text-underline-offset:4px}

/* Faustregel-Tafel: 2 × 2 Felder. Am Handy rückt die Zeilenüberschrift über ihre beiden Felder. */
.faust2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr);border:1px solid var(--line);border-bottom:0;border-right:0;border-radius:8px;overflow:hidden;font-size:.93rem}
.faust2>div{padding:8px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.faust2 .fk,.faust2 .fz{background:var(--bg);font-family:var(--display);font-weight:700}
.faust2 small{display:block;font-family:var(--body);font-weight:400;font-size:.75rem;color:var(--muted)}
.faust2 .fc b{display:block;font-family:var(--display);font-size:1.02rem}
.faust2 .fc.an{background:var(--mark)}
@media (max-width:520px){.faust2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.faust2 .leer{display:none}.faust2 .fz{grid-column:1/-1}}
.bsp{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.3fr) minmax(0,.6fr);gap:2px 12px;padding:5px 0;border-top:1px solid var(--line);font-size:.92rem;align-items:baseline}
@media (max-width:520px){.bsp{grid-template-columns:minmax(0,1fr)}}
ol.schritte{margin:0;padding-left:1.4em;display:grid;gap:6px}
ol.schritte li.an{font-weight:700;color:var(--acc)}
ol.schritte li.fertig{color:var(--muted)}

/* Übersetzen */
.textblock{font-family:var(--display);font-size:1.08rem;line-height:1.9}
.textblock .s{border-radius:6px;padding:1px 3px}
.textblock .s.an{background:var(--mark)}
.textblock .s.gut{color:var(--ok)}
.textblock .nr{font-family:var(--body);font-size:.7rem;color:var(--muted);vertical-align:super;margin-right:2px}
.fussn{font-size:.85rem;color:var(--muted);display:grid;gap:2px}
textarea.ueb{font:inherit;width:100%;min-height:5.2em;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);resize:vertical}
.lex{background:var(--blau-soft);border-radius:10px;padding:10px 14px;font-size:.95rem}
.lex:empty{display:none}
ul.bausteine{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:.93rem}
ul.bausteine li::before{content:"✓ ";color:var(--ok);font-weight:700}
ul.bausteine li.fehlt::before{content:"? ";color:var(--ton)}
ul.bausteine li.fehlt{color:var(--ton)}
.muster{border-left:4px solid var(--acc);padding:6px 12px;background:var(--acc-soft);border-radius:0 8px 8px 0}

/* Sterne und Marken in Kacheln: .tile span würde sie grau färben */
.tile .sterne{color:#e2a400;font-size:1.05rem}
.tile .sterne i{color:var(--line)}
.tile .tag{color:var(--blau);font-size:.7rem}
/* nichts ragt aus der Karte: Rasterkinder dürfen schmaler werden, die Tafel bricht um oder lässt sich schieben */
#schritt>*,.kasten>*,.blatt>*{min-width:0}
.satz .nb{white-space:nowrap}
.eigen{overflow-wrap:anywhere}

/* Blätter zum Drucken */
.blatt{display:grid;gap:12px}
.blatt .kopf{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap;border-bottom:3px solid var(--acc);padding-bottom:6px}
.blatt .kopf .wo{font-size:.8rem;color:var(--muted)}
.zwei{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.zwei{grid-template-columns:1fr}}
.kasten{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px;align-content:start}
ol.saetze{margin:0;padding-left:1.6em;display:grid;gap:10px;font-family:var(--display);font-size:1.08rem}
ol.saetze.loesung{font-family:var(--body);font-size:.95rem;gap:6px}
#druck{display:none}
@media print{
  @page{size:A4;margin:13mm 14mm}
  :root,:root:not([data-theme="light"]),:root[data-theme="dark"]{
    --bg:#fff; --paper:#fff; --ink:#000; --muted:#444; --line:#aaa; --acc:#1f5a4a; --acc-soft:#eef5f2; --ton:#a8431c; --ton-soft:#fbeee6;
    --blau:#24508c; --blau-soft:#eef2f9; --ok:#2e7d4f; --ok-soft:#eef7f1; --bad:#b3372e; --bad-soft:#fbefed; --mark:#fff6c9; color-scheme:light}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff;color:#000;padding:0;font-size:10.5pt;line-height:1.4}
  body,#druck,#druck *{font-family:Arial,"Helvetica Neue",Helvetica,"Liberation Sans",sans-serif}
  .bar{display:none!important}
  body.druckt #app{display:none!important}
  body:not(.druckt) #druck{display:none!important}
  #druck{display:block;max-width:none}
  #druck .blatt{break-after:page;gap:8pt}
  #druck .blatt:last-child{break-after:auto}
  #druck h2{font-size:15pt}
  #druck h3{font-size:11pt}
  #druck .satz{font-size:12pt;line-height:2.6}
  #druck ol.saetze{font-size:12.5pt;gap:13pt;line-height:1.9}
  #druck ol.saetze.loesung{font-size:10pt;gap:3pt;line-height:1.32}
  #druck ol.saetze.loesung .small{font-size:9pt}
  #druck .kasten,#druck .merk,#druck .achtung{break-inside:avoid}
  #druck .faust2,#druck .bsp{font-size:9.5pt}
  #druck .faust2>div{padding:4pt 6pt}
}
</style>

<script>
'use strict';
const $ = (s, r) => (r || document).querySelector(s), $$ = (s, r) => [...(r || document).querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const isObj = x => x && typeof x === 'object' && !Array.isArray(x);
const L = s => `<span class="lat">${s}</span>`;

//#REIN-ANFANG  (bis REIN-ENDE: nur Daten und Satzbau, ohne Seite – das liest tools/arbeit-check.mjs)

function startFolge(art, k) {

  R = { art, k, titel: def.titel, steps: def.steps(), i: 0, fehler: 0, rot: new Set() };

}
function renderFolge() {

  $('#ende').onclick = () => { if (confirm('Wirklich beenden? Der Stand dieser Runde geht verloren.')) go('aci'); };
  const vorher = R.fehler;
  STEP[st.t]($('#schritt'), st, () => {
    // Punkte und Serie sind da schon verbucht (treffer, fehlgriff) – je Aufgabe, nicht je Schritt.

}
function folgeFertig() {
  const n = R.steps.length, gut = n - R.rot.size; let kopf, text, knoepfe;

    const st = R.fehler <= 1 ? 3 : R.fehler <= 3 ? 2 : R.fehler <= 6 ? 1 : 0, i = SKEYS.indexOf(R.k), next = SKEYS[i + 1];
    if (st) { S.st[R.k] = Math.max(S.st[R.k] || 0, st); save(); }
    kopf = st ? `Station geschafft ${sterne(st)}` : 'Das war noch zu wackelig';
    text = st ? (R.fehler ? `Du hattest ${R.fehler} Fehler.${st < 3 ? ' Mit höchstens einem Fehler gibt es drei Sterne.' : ''}` : 'Ohne einen einzigen Fehler!') : `Das waren ${R.fehler} Fehler. Geh die Station gleich noch einmal durch – beim zweiten Mal geht es leichter.`;

    text = pz === 100 ? 'Alles richtig – stark!' : pz >= 75 ? 'Das sitzt schon gut.' : 'Übung macht es: gleich noch eine Runde?';
    if (alt.n && pz > alt.b) text += ' Neuer Bestwert!';
    app.innerHTML = ergebnis(kopf, text, '<button class="btn" id="b2" type="button">Noch eine Runde</button><button class="btn ghost" id="b3" type="button">Zur Werkstatt</button>');

const ergebnis = (kopf, text, knoepfe) => `<header class="top"><div class="eyebrow">AcI-Werkstatt</div><h1>${R.titel}</h1></header><section><div class="card" style="text-align:center"><div class="gross">${kopf}</div><p>${text}</p><div class="mitte">${knoepfe}</div></div></section>`;

// Nachgeschlagene Wörter im Vokabelheft „Klassenarbeit Dezember“ (index.html) als schwierig markieren – derselbe Speicher,
// den dort ein Tipp auf die Zeile füllt. Klappt nur, wenn beide Seiten vom selben Ort geladen sind.
function markiere(woerter) {
  try {
    let m = JSON.parse(localStorage.getItem('vokabelheftSchwierig') || '{}'), neu = 0;
    if (!isObj(m)) m = {};
    for (const k of woerter) for (const e of LEX.filter(x => x[0] === k && x[3])) { const key = `ka1226|${e[3]}|${e[0]}`; if (!m[key]) { m[key] = { h: 0, d: 0, r: null }; neu++; } }
    localStorage.setItem('vokabelheftSchwierig', JSON.stringify(m)); return neu;
  } catch (e) { return -1; }
}

  $('#dr').onclick = () => drucken(BL); $('#zur').onclick = () => go(BL[0] === 'spick' ? 'aci' : 'texte');
}

  const stFertig = SKEYS.filter(k => S.st[k]).length, txFertig = TEXTE.filter(t => S.tx[t.k]).length;
  app.innerHTML = `<header class="top"><div class="eyebrow">Latein · Klassenarbeit Dezember</div><h1>AcI und Übersetzen</h1>

      <button class="tile gross ${txFertig === TEXTE.length ? 'done' : ''}" type="button" id="hText"><b>🌋 Übersetzen: Pompeji</b><span>Texte Latein → Deutsch, Satz für Satz, mit Wortschatz-Hilfe und Musterlösung</span><span>${txFertig} von ${TEXTE.length} Texten übersetzt</span></button></div></section>
    <section><h2>Auch für die Arbeit</h2><div class="grid"><a class="tile" href="index.html#latein-arbeit"><b>📖 Wortschatz</b><span>Vokabeln, Vokabelheft und Rakete mit den Wörtern vom Blatt</span></a>
      <a class="tile" href="latein-perfekt.html?von=arbeit"><b>🧱 Perfekt-Baukasten</b><span>Die 34 Verben der Arbeit: Perfektstamm verstehen und üben</span></a>

  $('#hAci').onclick = () => go('aci'); $('#hText').onclick = () => go('texte'); $('#hDruck').onclick = () => drucken(ALLEBLAETTER());
}
function render() {
  ({ home: renderHome, aci: renderAci, folge: renderFolge, texte: renderTexte, text: renderText, blatt: renderBlatt }[VIEW] || renderHome)();
  sperre();
}
// mitten in einer Runde oder einem Text? (Die fertige Auswertung zählt nicht mehr dazu – sie ist gebucht.)
const mittendrin = () => VIEW === 'folge' || (VIEW === 'text' && T && T.phase !== 'ende');
$('#homeBtn').onclick = () => {
  if (mittendrin() && !confirm('Zur Übersicht? Der Stand dieser Runde geht verloren.')) return;
  go('home');
};
$('#zurueck').onclick = e => { if (mittendrin() && !confirm('Zurück zur Klassenarbeit? Der Stand dieser Runde geht verloren.')) e.preventDefault(); };
// Sprungziel ändert sich, während die Seite offen ist
window.addEventListener('hashchange', () => { const v = location.hash === '#aci' ? 'aci' : location.hash === '#text' ? 'texte' : null; if (v && !mittendrin()) go(v); });
document.body.classList.add('druckt');
druckFuellen(ALLEBLAETTER());
VIEW = location.hash === '#aci' ? 'aci' : location.hash === '#text' ? 'texte' : 'home';
render();
</script>
