<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NAWI-Mission: Kräfte</title>
<!-- NAWI Kl. 6, zweite Fassung „Mission“: derselbe Stoff wie nawi.html (Kraft und Wirkungen, Gewichtskraft und Masse,
     Federkraftmesser, Hebel, Rollen), aber anders aufgebaut: erst tippen, dann das Experiment sehen, ein Spiel pro Thema,
     Merksatz selbst bauen. Faktenwissen in der Blitzrunde, Rechnen bei den Endgegnern.
     Zeichenfunktionen, Antwortfelder und Aufgabengeneratoren sind aus nawi.html übernommen.
     Speicher: localStorage „nawi-6-mission-v1“. -->
<style>
:root{
  --bg:#f3f4f1; --paper:#ffffff; --ink:#1c2321; --muted:#5d6763; --line:#d6dad4;
  --acc:#2c6b5a; --acc-soft:#dcefe8; --ton:#b4532a; --ton-soft:#f8e3d6; --blau:#2f5d9c; --blau-soft:#dfe8f6;
  --ok:#2e7d4f; --ok-soft:#dff1e6; --bad:#b3372e; --bad-soft:#f8e1de; --mark:#fff0a8;
  --holz:#c99a5b; --metall:#8a9399;
  --display:"Trebuchet MS", system-ui, sans-serif;
  --body:Verdana, system-ui, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121816; --paper:#1b2321; --ink:#e6ecea; --muted:#9aa7a2; --line:#33403c;
  --acc:#79c7b0; --acc-soft:#1c3a32; --ton:#ec9a6e; --ton-soft:#3f2519; --blau:#8db4ec; --blau-soft:#1d2c42;
  --ok:#6fd39a; --ok-soft:#173a27; --bad:#f08a80; --bad-soft:#42201d; --mark:#5a4d12;
  --holz:#a77c45; --metall:#9aa4aa; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121816; --paper:#1b2321; --ink:#e6ecea; --muted:#9aa7a2; --line:#33403c;
  --acc:#79c7b0; --acc-soft:#1c3a32; --ton:#ec9a6e; --ton-soft:#3f2519; --blau:#8db4ec; --blau-soft:#1d2c42;
  --ok:#6fd39a; --ok-soft:#173a27; --bad:#f08a80; --bad-soft:#42201d; --mark:#5a4d12;
  --holz:#a77c45; --metall:#9aa4aa; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:820px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px)) 64px}
h1,h2,h3{font-family:var(--display);line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:clamp(1.7rem,5.5vw,2.5rem)}
h2{font-size:1.4rem}
h3{font-size:1.1rem}
p{margin:0}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar .in{max-width:820px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar a,.linkbtn{color:var(--acc);text-decoration:none;font-size:.9rem;background:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;font-family:inherit;min-height:40px;display:inline-flex;align-items:center}
@media (max-width:560px){.bar .crumb{display:none}}
.bar .crumb{color:var(--muted);font-size:.85rem;margin-left:auto}
header.top{padding:28px 0 8px;display:grid;gap:8px}
.eyebrow{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.88rem}
section{margin-top:28px;display:grid;gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:12px;min-width:0}
.card>*{min-width:0}
button{font:inherit;cursor:pointer;color:inherit}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-weight:700;min-height:44px}
:root[data-theme="dark"] .btn:not(.ghost){color:#0f1518}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn:not(.ghost){color:#0f1518}}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:400}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

/* Plan */
.plan{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.plan li{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.plan li.next{border:2px solid var(--acc)}
.plan li .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc);font-weight:700;font-size:.9rem}
.plan li.done .n{background:var(--ok-soft);color:var(--ok)}
.plan li .t{font-weight:700}
.plan li .d{font-size:.85rem;color:var(--muted)}
.plan li .m{font-size:.85rem;color:var(--muted);white-space:nowrap}
.tag{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:999px;background:var(--blau-soft);color:var(--blau);vertical-align:middle;margin-right:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:left;color:var(--ink);display:grid;gap:4px}
.tile b{font-size:1rem}
.tile span{font-size:.85rem;color:var(--muted)}
.meter{height:8px;border-radius:4px;background:var(--acc-soft);overflow:hidden}
.meter i{display:block;height:100%;background:var(--acc)}

/* Karten */
.frage{font-weight:700}
.q{font-size:1.05rem}
.q b{color:var(--acc)}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;background:var(--bg);color:var(--ink);font-size:.95rem;min-height:40px;text-align:left}
.opt.sel{border-color:var(--acc);background:var(--acc-soft);font-weight:700}
.opts.liste{display:grid}
.opts.liste .opt{border-radius:10px}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.fehlt{border:2px dashed var(--ok)}
.opt:disabled{cursor:default;opacity:1}
.fld{display:grid;gap:6px}
.fl{font-size:.92rem;color:var(--muted)}
.fnum{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fnum .fl{color:var(--ink);font-weight:700}
.fnum input{font:inherit;font-size:18px;width:7.5em;min-height:44px;padding:6px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);text-align:right}
.fnum input.ok{border-color:var(--ok);background:var(--ok-soft)}
.fnum input.no{border-color:var(--bad);background:var(--bad-soft)}
.fnum .u{font-weight:700}
.sol{font-size:.85rem;color:var(--bad);font-weight:700}
.mrow{display:grid;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .mt{font-weight:700;font-size:.98rem}
.fb{display:grid;gap:10px}
.fb .msg{padding:10px 12px;border-radius:8px;font-size:.95rem}
.fb .msg.ok{background:var(--ok-soft);border-left:4px solid var(--ok)}
.fb .msg.no{background:var(--bad-soft);border-left:4px solid var(--bad)}
.weg{background:var(--bg);border-radius:8px;padding:10px 12px;font-size:.93rem;font-variant-numeric:tabular-nums}
.weg div{margin:2px 0}
.progress{display:flex;gap:6px;align-items:center;font-size:.85rem;color:var(--muted);flex-wrap:wrap}
.dots{display:flex;gap:4px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ok)}
.tippbox{display:grid;gap:6px}
.tipps{margin:0;padding:10px 12px 10px 28px;background:var(--acc-soft);border-radius:8px;font-size:.9rem;display:grid;gap:4px}
.tipps[hidden]{display:none}
.merk{background:var(--acc-soft);border-radius:10px;padding:12px 14px;font-size:.95rem}
.merk ul{margin:6px 0 0;padding-left:20px}
.merk li{margin:4px 0}
.hl{color:var(--ton);font-weight:700}
.formel{font-family:var(--display);font-size:1.15rem;font-weight:700;text-align:center;padding:8px;border:2px dashed var(--ton);border-radius:10px;background:var(--paper)}
.fig{display:flex;justify-content:center}
.fig svg{max-width:100%;height:auto}

/* SVG-Grundfarben (hell/dunkel) */
svg text{fill:var(--ink);font-family:var(--body)}
.s-ink{stroke:var(--ink);fill:none}
.s-line{stroke:var(--line)}
.s-muted{stroke:var(--muted);fill:none}
.f-holz{fill:var(--holz);stroke:var(--ink);stroke-width:1}
.f-metall{fill:var(--metall);stroke:var(--ink);stroke-width:1}
.f-paper{fill:var(--paper);stroke:var(--ink);stroke-width:1.2}
.f-acc{fill:var(--acc)}
.f-ton{fill:var(--ton)}
.s-ton{stroke:var(--ton);fill:none}
.s-blau{stroke:var(--blau);fill:none}
.f-blau{fill:var(--blau)}
.f-ink{fill:var(--ink)}
.f-muted{fill:var(--muted)}
.f-bg{fill:var(--bg)}
.f-ok{fill:var(--ok)}
.hit{fill:transparent;cursor:pointer}
@media (hover:hover){.hit:hover{fill:var(--acc-soft);opacity:.6}}

/* Labor */
.lab{display:grid;gap:12px}
.labfig{background:var(--bg);border-radius:10px;padding:8px;display:flex;justify-content:center;touch-action:manipulation}
.labfig svg{width:100%;max-width:520px;height:auto;user-select:none;-webkit-user-select:none}
.anzeige{display:flex;gap:8px;flex-wrap:wrap}
.anzeige span{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:.92rem;font-variant-numeric:tabular-nums}
.anzeige span.gut{background:var(--ok-soft);border-color:var(--ok);font-weight:700}
.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.seg button{border:0;background:var(--bg);padding:7px 14px;min-height:40px;font-size:.92rem;white-space:nowrap}
.seg button.on{background:var(--acc);color:#fff;font-weight:700}
:root[data-theme="dark"] .seg button.on{color:#0f1518}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button.on{color:#0f1518}}
.auftrag{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.auftrag li{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:start;font-size:.95rem}
.auftrag li .c{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;margin-top:2px}
.auftrag li.done .c{background:var(--ok);border-color:var(--ok);color:#fff}
:root[data-theme="dark"] .auftrag li.done .c{color:#0f1518}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .auftrag li.done .c{color:#0f1518}}
.auftrag li.done{color:var(--muted)}
table.mess{border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums}
table.mess th,table.mess td{border:1px solid var(--line);padding:4px 10px;text-align:right;white-space:nowrap}
table.mess th{background:var(--bg)}
.tabwrap{overflow-x:auto}
input[type=range]{width:100%;min-height:40px;accent-color:var(--acc)}
.lfrage{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}

/* Probearbeit */
.timer{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.pts{font-size:.85rem;color:var(--muted);white-space:nowrap}
.th{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.score{font-family:var(--display);font-size:1.6rem;font-weight:800}
.erkl{font-size:.9rem;background:var(--bg);border-radius:8px;padding:8px 12px}

#druck{display:none}
@media print{
  :root,:root:not([data-theme="light"]),:root[data-theme="dark"]{
    --bg:#fff; --paper:#fff; --ink:#000; --muted:#444; --line:#999; --acc:#2c6b5a; --acc-soft:#eef5f2; --ton:#b4532a; --ton-soft:#fbeee6;
    --blau:#2f5d9c; --blau-soft:#eef2f9; --ok:#2e7d4f; --ok-soft:#eef7f1; --bad:#b3372e; --bad-soft:#fbefed; --holz:#c99a5b; --metall:#8a9399; color-scheme:light}
  body{background:#fff;color:#000;padding:0}
  .bar{display:none!important}
  body.druckt #app{display:none!important}
  body:not(.druckt) #druck{display:none!important}
  #druck{display:block;font-size:11pt;padding:6mm 8mm}
  #druck h2{font-size:15pt;margin:0 0 4pt}
  #druck .pa{break-inside:avoid;border-top:1px solid #999;padding:6pt 0}
  #druck .pa h3{font-size:11.5pt;margin:0 0 3pt;display:flex;justify-content:space-between}
  #druck .lin{border-bottom:1px solid #777;display:inline-block;min-width:24mm;height:1.2em}
  #druck svg{max-width:85mm;height:auto}
  #druck svg text{fill:#000}
  #druck .neu{break-before:page}
  #druck .box{display:inline-block;width:3.2mm;height:3.2mm;border:1px solid #000;margin-right:4px;vertical-align:-1px}
  #druck .zt td{padding:2pt 8pt 2pt 0}
}
/* ---- NAWI-Mission ---- */
a.tile{text-decoration:none}
.tile.done{border-color:var(--ok)}
.tile .tag{justify-self:start}
.btn.gross{font-size:1.05rem;padding:14px 22px}
.sterne,.tile .sterne{color:#e2a400;letter-spacing:2px;font-size:1.05rem}
button,.opt,.chip,input[type=range]{touch-action:manipulation}
.lochrow{display:flex;gap:6px;align-items:center;justify-content:center}
.lochrow .opt{flex:1 1 0;max-width:72px;min-height:44px;padding:6px 0;text-align:center;font-weight:700}
.sterne i,.tile .sterne i{font-style:normal;color:var(--line)}
.dots i.jetzt{background:var(--acc)}
.pluswissen{background:var(--mark);color:var(--ink);border-radius:999px;padding:2px 10px;letter-spacing:0;text-transform:none;margin-left:6px;white-space:nowrap}
.plusbox{background:var(--mark);border-radius:8px;padding:8px 12px;font-size:.88rem}
.labfig.schmal svg{max-width:340px}
.opt.x{opacity:.55}
.regler{display:grid;gap:6px}
.msatz{font-size:1.05rem;line-height:1.9}
.gap{display:inline-block;min-width:3.2em;text-align:center;border-bottom:2px solid var(--line);padding:0 6px;border-radius:4px}
.gap.dran{background:var(--mark);border-color:var(--acc)}
.gap.voll{background:var(--ok-soft);border-color:var(--ok);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--bg);border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;min-height:44px;font-weight:700}
.chip.wackel{animation:wackel .35s;border-color:var(--bad)}
@keyframes wackel{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
@media (prefers-reduced-motion:reduce){.chip.wackel{animation:none}}
.blitz{text-align:center}
.blitz .anzeige{justify-content:center}
.bsatz{font-family:var(--display);font-size:1.45rem;font-weight:700;min-height:3.6em;display:grid;place-items:center;text-wrap:balance}
.bwahl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bwahl .opt{min-height:64px;font-weight:700;font-size:1.02rem;text-align:center;justify-content:center}
ul.fehler,ul.plus{margin:0;padding-left:1.2em;display:grid;gap:4px}
ul.plus{font-size:.92rem;color:var(--muted)}
@media print{.bar,.btn,.linkbtn{display:none!important}.card{break-inside:avoid}}
</style>
</head>
<body>
<div class="bar"><div class="in">
  <a href="nawi-menu.html">← NAWI-Auswahl</a>
  <button class="linkbtn" id="homeBtn" type="button">🚀 Übersicht</button>
  <span class="crumb" id="crumb"></span>
</div></div>
<main class="wrap" id="app"></main>
<script>
'use strict';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const isObj = x => !!x && typeof x === 'object' && !Array.isArray(x);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
// Zahl deutsch schreiben, höchstens zwei Nachkommastellen
const zahl = x => { const r = Math.round(x * 100) / 100; return String(r).replace('.', ','); };
const parseZahl = s => {
  s = String(s || '').trim().replace(/[\u2212\u2013]/g, '-').replace(/\s*[a-zA-ZäöüÄÖÜµ²]+\.?$/, '').trim(); // „30 N“ → 30
  if (/\d\s+\d/.test(s)) return NaN;                         // „1 2“ ist keine Zahl
  s = s.replace(/\s/g, '');
  if (!s.includes(',') && /^[-+]?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, ''); // 2.500 → 2500
  s = s.replace(',', '.').replace(/\.$/, '');                 // „5,“ → 5
  if (!/^[-+]?\d*\.?\d+$/.test(s)) return NaN; return parseFloat(s);
};
// ===================================================================
// ANTWORTFELDER (für Übungskarten und Probearbeiten gleich)
//  num:    { t:'num', l, a, u, tol? }      Zahl eintippen
//  wahl:   { t:'wahl', l?, o:[...], a }    eine Antwort antippen
//  multi:  { t:'multi', l?, o:[...], a:[] } alle richtigen antippen
//  zuord:  { t:'zuord', cats:[...], rows:[[text, catIdx], ...] }
//  Antworten liegen in A[key], die gemischte Reihenfolge in A[key+'#o'].
// ===================================================================
const fkey = (it, i) => it.id + '|' + i;
function feldMax(f) { return f.p || (f.t === 'zuord' ? f.rows.length : f.t === 'multi' ? f.a.length : 1); }
function ordnung(f, A, k, n) {
  const o = A[k + '#o'];
  const gut = Array.isArray(o) && o.length === n && [...o].sort((x, y) => x - y).every((x, i) => x === i);
  if (!gut) A[k + '#o'] = f.fix ? [...Array(n).keys()] : shuffle([...Array(n).keys()]);
  return A[k + '#o'];
}
function feldHtml(it, i, A, fertig) {
  const f = it.fields[i], k = fkey(it, i), v = A[k];
  const lab = f.l ? `<span class="fl">${f.l}</span>` : '';
  if (f.t === 'num') {
    const ev = fertig ? feldWert(f, v) : null;
    return `<div class="fld"><label class="fnum">${lab}<input data-k="${k}" inputmode="decimal" autocomplete="off" value="${esc(v || '')}" ${fertig ? 'disabled' : ''} class="${ev ? (ev.ok ? 'ok' : 'no') : ''}" aria-label="${esc((f.l || 'Antwort').replace(/<[^>]+>/g, ''))}">${f.u ? `<span class="u">${f.u}</span>` : ''}</label>${ev && !ev.ok ? `<span class="sol">richtig: ${zahl(f.a)} ${f.u || ''}</span>` : ''}</div>`;
  }
  if (f.t === 'wahl' || f.t === 'multi') {
    const ord = ordnung(f, A, k, f.o.length), multi = f.t === 'multi';
    const sel = multi ? (Array.isArray(v) ? v : []) : v;
    const lang = f.o.some(o => o.length > 28);
    return `<div class="fld">${lab}<div class="opts ${lang ? 'liste' : ''}" data-k="${k}" data-multi="${multi ? 1 : 0}">${ord.map(j => {
      const an = multi ? sel.includes(j) : sel === j;
      let cls = an ? 'sel' : '';
      if (fertig) { const rich = multi ? f.a.includes(j) : f.a === j; cls = rich ? (an ? 'ok' : 'fehlt') : (an ? 'no' : ''); }
      return `<button type="button" class="opt ${cls}" data-j="${j}" ${fertig ? 'disabled' : ''} aria-pressed="${an}">${esc(f.o[j])}</button>`;
    }).join('')}</div></div>`;
  }
  if (f.t === 'zuord') {
    const ord = ordnung(f, A, k, f.rows.length), w = isObj(v) ? v : {};
    return `<div class="fld">${lab}${ord.map(r => {
      const row = f.rows[r];
      return `<div class="mrow"><span class="mt">${esc(row[0])}</span><div class="opts" data-k="${k}" data-r="${r}">${f.cats.map((c, j) => {
        const an = w[r] === j; let cls = an ? 'sel' : '';
        if (fertig) cls = row[1] === j ? (an ? 'ok' : 'fehlt') : (an ? 'no' : '');
        return `<button type="button" class="opt ${cls}" data-j="${j}" ${fertig ? 'disabled' : ''} aria-pressed="${an}">${esc(c)}</button>`;
      }).join('')}</div></div>`;
    }).join('')}</div>`;
  }
  return '';
}
// bewertet ein Feld: { ok, pts, max, leer }

function load() {
  try {

    const s = blank();
    MKEYS.forEach(k => {
      if (isObj(o.st) && Number.isInteger(o.st[k]) && o.st[k] >= 1 && o.st[k] <= 3) s.st[k] = o.st[k];

function federnSvg(items) {
  const px = 13, top = 16, L0 = 44, z = top + L0, B = 116;
  let s = `<svg viewBox="0 0 ${Math.max(240, items.length * B + 8)} 300" role="img" aria-label="Federn mit Lineal">`;
  items.forEach((it, i) => {
    const cx = 40 + i * B, ext = it.ext == null ? 0 : it.ext, bot = z + ext * px;
    s += `<rect x="${cx - 26}" y="6" width="52" height="8" class="f-muted"/>`;
    if (it.band) s += `<path d="M${cx - 5} ${top} L${cx - 2} ${bot} h4 L${cx + 5} ${top} z" fill="#c75b39" stroke="#7a2e19"/>`;
    else { let d = `M${cx} 14 V${top + 6}`; const n = 10, len = bot - top - 14; for (let k = 0; k < n; k++) d += ` L${cx + (k % 2 ? -11 : 11)} ${(top + 6 + len * (k + .5) / n).toFixed(1)}`; d += ` L${cx} ${bot - 8} V${bot}`; s += `<path d="${d}" class="s-ink" stroke-width="2" stroke-linejoin="round"/>`; }
    s += `<rect x="${cx - 24}" y="${bot}" width="48" height="24" rx="3" fill="#9cc0ee" stroke="#333"/><text x="${cx}" y="${bot + 16}" text-anchor="middle" font-size="11.5" font-weight="700" style="fill:#111">${it.cap}</text>`;
    const rx = cx + 34; s += `<rect x="${rx}" y="${z - 8}" width="34" height="${12 * px + 16}" class="f-paper"/>`;
    for (let c = 0; c <= 12; c++) { const y = z + c * px; s += `<line x1="${rx}" x2="${rx + (c % 2 ? 7 : 12)}" y1="${y}" y2="${y}" class="s-ink"/>`; if (c % 2 === 0) s += `<text x="${rx + 15}" y="${y + 4}" font-size="10">${c}</text>`; }
    if (it.ext != null) s += `<line x1="${cx + 8}" x2="${rx}" y1="${bot}" y2="${bot}" stroke="#d33" stroke-width="1.5" stroke-dasharray="4 3"/>`;
    if (i === 0) s += `<text x="${rx + 17}" y="${z - 12}" text-anchor="middle" font-size="10" class="f-muted">cm</text>`;
  });
  return s + '</svg>';
}
// Wippe mit Löchern bei 10 … 50 cm; L und R: { Loch: Anzahl 1-N-Stücke }
function wippeSvg(L, R, ang, hits) {
  let s = `<svg viewBox="0 54 360 300" role="img" aria-label="Zweiseitiger Hebel"><path d="M180 128 l-18 60 h36 z" class="f-ton"/><rect x="120" y="188" width="120" height="8" class="f-muted"/><g transform="rotate(${ang.toFixed(2)} 180 120)"><rect x="20" y="114" width="320" height="12" rx="3" class="f-holz"/>`;
  for (let k = 1; k <= 5; k++) for (const sd of [-1, 1]) {
    const x = 180 + sd * k * 30, n = (sd < 0 ? L : R)[k] || 0;
    s += `<circle cx="${x}" cy="120" r="3.2" class="f-ink"/><text x="${x}" y="107" text-anchor="middle" font-size="13" class="f-muted">${k * 10}</text>`;
    if (n) { s += `<line x1="${x}" x2="${x}" y1="120" y2="133" class="s-ink" stroke-width="1.5"/>`; for (let i = 0; i < n; i++) s += `<rect x="${x - 13}" y="${133 + i * 17}" width="26" height="16" rx="2" fill="${sd < 0 ? '#9cc0ee' : '#c9cfd2'}" stroke="#333" stroke-width=".8"/><text x="${x}" y="${145.5 + i * 17}" text-anchor="middle" font-size="11" font-weight="700" style="fill:#111">1 N</text>`; }
    if (sd > 0 && hits) s += `<rect class="hit" data-p="${k}" x="${x - 15}" y="88" width="30" height="${Math.max(80, 50 + n * 17)}" rx="6"/>`;
  }
  return s + `</g><circle cx="180" cy="120" r="5" class="f-ink"/></svg>`;
}

// ---------- Spiel K: Blitzer-Challenge (Tempo nach 1 s Schub = Kraft : Masse) ----------
function spielSchub(host, fertig) {
  const runden = [{ m: 1, v: pick([3, 4, 5]) }, { m: 2, v: pick([2, 3]) }, { m: 3, v: pick([1, 2]) }];
  let i = 0, F = 1, fehler = 0, laeuft = false;
  host.innerHTML = `<p class="small muted"><b>Testfahrt:</b> 1 N schiebt den 1-kg-Wagen eine Sekunde lang an – danach fährt er <b>1 m/s</b> (1 Meter pro Sekunde). Stell die Schubkraft so ein, dass der Blitzer genau das Ziel-Tempo misst. </p><p class="plusbox"><b>⭐ Plus-Wissen:</b> Das Rechnen mit m/s geht über den Stoff der Klassenarbeit hinaus. Für die Arbeit reicht: mehr Kraft – stärkere Beschleunigung, mehr Masse – träger.</p>
    <div class="anzeige" id="sa"></div><div class="labfig" id="sf"></div>
    <label class="regler"><span>Schubkraft: <b id="kv"></b> <span class="small muted">(je länger der Pfeil, desto größer die Kraft)</span></span><input type="range" id="kraft" min="1" max="6" step="1" value="1"></label>
    <div class="row"><button class="btn" id="los">Schub!</button></div><div id="sfb" aria-live="polite"></div>`;
  const q = s => host.querySelector(s);
  const zeig = () => { const r = runden[i]; q('#sa').innerHTML = `<span>Runde <b>${i + 1}</b> von 3</span><span>Wagen: <b>${r.m} kg</b></span><span>Ziel: <b>${r.v} m/s</b></span>`; q('#kv').textContent = F + ' N'; q('#sf').innerHTML = schubSvg(40, r.m, F, 'Ziel ' + r.v + ' m/s'); };
  q('#kraft').oninput = e => { if (laeuft) return; F = +e.target.value; q('#sfb').innerHTML = ''; zeig(); };
  q('#los').onclick = () => {
    if (laeuft) return; laeuft = true; q('#los').disabled = true; q('#kraft').disabled = true;
    const r = runden[i], v = F / r.m, ok = Math.abs(v - r.v) < 1e-9;
    anim(2600 / Math.max(v, .8), t => { q('#sf').innerHTML = schubSvg(40 + 265 * t, r.m, t < .3 ? F : 0, t < .55 ? '…' : zahl(v) + ' m/s', t < .55 ? null : ok); }, () => {
      laeuft = false;
      if (ok) {
        const letzte = i === 2;
        q('#sfb').innerHTML = `<div class="fb"><div class="msg ok"><b>✓ Genau ${r.v} m/s!</b> ${F} N auf ${r.m} kg. ${r.m > 1 ? `Der Wagen hat ${r.m}-mal so viel Masse – also brauchst du für dasselbe Tempo auch ${r.m}-mal so viel Kraft wie beim 1-kg-Wagen.` : 'Mehr Kraft – stärkere Beschleunigung.'}</div><div class="row"><button class="btn" id="wr">${letzte ? 'Fertig' : 'Nächste Runde'}</button></div></div>`;
        q('#wr').onclick = () => { if (letzte) return fertig(ausFehlern(fehler), fehler ? `${fehler} Fehlversuch${fehler === 1 ? '' : 'e'}` : 'Kein einziger Fehlversuch!'); i++; F = 1; q('#kraft').value = 1; q('#kraft').disabled = false; q('#los').disabled = false; q('#sfb').innerHTML = ''; zeig(); };
      } else {
        fehler++; q('#kraft').disabled = false; q('#los').disabled = false;
        q('#sfb').innerHTML = `<div class="fb"><div class="msg no"><b>${zahl(v)} m/s – zu ${v > r.v ? 'schnell' : 'langsam'}.</b> ${v > r.v ? 'Weniger' : 'Mehr'} Kraft! Denk dran: ${r.m > 1 ? `${r.m} kg sind ${r.m}-mal so träge wie 1 kg.` : '1 N bringt 1 kg auf 1 m/s.'}</div></div>`;
        q('#sf').innerHTML = schubSvg(40, r.m, F, zahl(v) + ' m/s', false);
      }
    });
  };
  zeig();
}

// ---------- Spiel G: Ansage! (vor dem Anhängen sagen, was der Kraftmesser zeigt) ----------
function spielAnsage(host, fertig) {
  const g = pick([200, 300, 400, 600, 700]), k = pick([1.5, 2.5, 3.5, 4.5]), mo = pick([6, 12, 18, 24]), rN = pick([15, 25, 35, 45]);
  const A = [
    { q: `🌍 Erde: Du hängst <b>${g} g</b> an den Kraftmesser. Sag an: Was zeigt er?`, a: g / 100, u: 'N', max: 10, cap: g + ' g', ort: '🌍', e: `100 g ≙ 1 N, also ${g} g ≙ ${zahl(g / 100)} N.` },
    { q: `🌍 Erde: Jetzt <b>${zahl(k)} kg</b>. Was zeigt der Kraftmesser?`, a: k * 10, u: 'N', max: 50, cap: zahl(k) + ' kg', ort: '🌍', e: `1 kg ≙ 10 N, also ${zahl(k)} kg ≙ ${zahl(k * 10)} N.` },
    { q: `🌙 Mond: Eine Kiste mit <b>${mo} kg</b> hängt am Kraftmesser. Was zeigt er dort?`, a: mo * 10 / 6, u: 'N', max: 50, cap: mo + ' kg', ort: '🌙', e: `Auf der Erde wären es ${mo * 10} N. Auf dem Mond etwa ein Sechstel: ${mo * 10} N : 6 = ${zahl(mo * 10 / 6)} N.` },
    { q: `🌍 Erde, andersherum: Der Kraftmesser zeigt <b>${rN} N</b>. Welche Masse hängt daran?`, a: rN / 10, u: 'kg', max: 50, cap: '? kg', ort: '🌍', zeigVor: rN, e: `10 N ≙ 1 kg, also ${rN} N ≙ ${zahl(rN / 10)} kg.` }
  ];
  let i = 0, treffer = 0;
  const zeig = () => {
    const a = A[i];
    host.innerHTML = `<div class="anzeige"><span>Ansage <b>${i + 1}</b> von ${A.length}</span><span>Treffer: <b>${treffer}</b></span></div><div class="q">${a.q}</div><div class="labfig schmal" id="sf">${messerSvg(a.max, a.zeigVor != null ? a.zeigVor : null, a.cap, a.ort)}</div>
      <div class="row"><label class="fnum"><input id="ein" inputmode="decimal" autocomplete="off" aria-label="Deine Ansage"><span class="u">${a.u}</span></label><button class="btn" id="ok">Ansage!</button><span class="small muted" id="leer"></span></div><div id="sfb" aria-live="polite"></div>`;
    const ein = host.querySelector('#ein'), los = () => {
      const x = parseZahl(ein.value); if (isNaN(x)) { host.querySelector('#leer').textContent = 'Tippe erst eine Zahl ein.'; return; }
      ein.disabled = true; host.querySelector('#ok').disabled = true;
      const ok = Math.abs(x - a.a) <= Math.max(a.a * .005, .011); if (ok) treffer++;
      const ende = () => {
        if (a.zeigVor != null) host.querySelector('#sf').innerHTML = messerSvg(a.max, a.zeigVor, zahl(a.a) + ' kg', a.ort);
        host.querySelector('#sfb').innerHTML = `<div class="fb"><div class="msg ${ok ? 'ok' : 'no'}"><b>${ok ? '✓ Richtig angesagt!' : '✗ Richtig wäre ' + zahl(a.a) + ' ' + a.u + '.'}</b> ${a.e}</div><div class="row"><button class="btn" id="wr">${i === A.length - 1 ? 'Fertig' : 'Weiter'}</button></div></div>`;
        host.querySelector('#wr').onclick = () => { if (i === A.length - 1) return fertig(treffer === 4 ? 3 : treffer === 3 ? 2 : 1, `${treffer} von 4 Ansagen richtig`); i++; zeig(); };
        spaeterFokus(host.querySelector('#wr'));
      };
      if (a.zeigVor != null) ende(); else anim(900, t => { host.querySelector('#sf').innerHTML = messerSvg(a.max, a.a * ease(t), a.cap, a.ort); }, ende);
    };
    host.querySelector('#ok').onclick = los; ein.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); los(); } };
  };
  zeig();
}

// ---------- Spiel F: Rätselsteine (mit einer geeichten Feder wiegen) ----------
function spielSteine(host, fertig) {
  const mk = rueck => { for (;;) { const c = pick([2, 3, 4]), F = pick([1.5, 2, 2.5, 3, 4]); if (c * F <= 12) return { c, F, x: c * F, rueck }; } };
  const A = [mk(false)]; for (;;) { const b = mk(false); if (b.c !== A[0].c || b.F !== A[0].F) { A.push(b); break; } } A.push(mk(true));
  let i = 0, treffer = 0;
  const zeig = () => {
    const a = A[i], ziel = a.rueck ? a.x : a.F, u = a.rueck ? 'cm' : 'N';
    host.innerHTML = `<div class="anzeige"><span>Stein <b>${i + 1}</b> von 3</span><span>Treffer: <b>${treffer}</b></span></div>
      <div class="q">${a.rueck ? `Diese Feder wird bei <b>1 N</b> um <b>${a.c} cm</b> länger. Der nächste Stein hat eine Gewichtskraft von <b>${zahl(a.F)} N</b>. Um wie viel wird die Feder länger?` : `Diese Feder wird bei <b>1 N</b> um <b>${a.c} cm</b> länger. Der Rätselstein dehnt sie um <b>${zahl(a.x)} cm</b>. Wie groß ist seine Gewichtskraft?`}</div>
      <div class="labfig schmal" id="sf">${federnSvg([{ ext: a.c, cap: '1 N' }, { ext: a.rueck ? null : a.x, cap: a.rueck ? zahl(a.F) + ' N' : 'Stein ?' }])}</div>
      <div class="row"><label class="fnum"><input id="ein" inputmode="decimal" autocomplete="off" aria-label="Deine Antwort"><span class="u">${u}</span></label><button class="btn" id="ok">Messen!</button><span class="small muted" id="leer"></span></div><div id="sfb" aria-live="polite"></div>`;
    const ein = host.querySelector('#ein'), los = () => {
      const x = parseZahl(ein.value); if (isNaN(x)) { host.querySelector('#leer').textContent = 'Tippe erst eine Zahl ein.'; return; }
      ein.disabled = true; host.querySelector('#ok').disabled = true;
      const ok = Math.abs(x - ziel) <= .011; if (ok) treffer++;
      const ende = () => {
        host.querySelector('#sf').innerHTML = federnSvg([{ ext: a.c, cap: '1 N' }, { ext: a.x, cap: zahl(a.F) + ' N' }]);
        host.querySelector('#sfb').innerHTML = `<div class="fb"><div class="msg ${ok ? 'ok' : 'no'}"><b>${ok ? '✓ Stimmt!' : '✗ Richtig wäre ' + zahl(ziel) + ' ' + u + '.'}</b> ${a.rueck ? `${zahl(a.F)}-mal so viel Kraft wie 1 N – also ${zahl(a.F)}-mal so viel Verlängerung: ${zahl(a.F)} · ${a.c} cm = ${zahl(a.x)} cm.` : `${zahl(a.x)} cm sind ${zahl(a.F)}-mal so viel wie ${a.c} cm – also ist die Kraft ${zahl(a.F)}-mal so groß wie 1 N.`}</div><div class="row"><button class="btn" id="wr">${i === 2 ? 'Fertig' : 'Nächster Stein'}</button></div></div>`;
        host.querySelector('#wr').onclick = () => { if (i === 2) return fertig(treffer === 3 ? 3 : treffer === 2 ? 2 : 1, `${treffer} von 3 Steinen richtig`); i++; zeig(); };
        spaeterFokus(host.querySelector('#wr'));
      };
      if (a.rueck) anim(900, t => { host.querySelector('#sf').innerHTML = federnSvg([{ ext: a.c, cap: '1 N' }, { ext: a.x * ease(t), cap: zahl(a.F) + ' N' }]); }, ende); else ende();
    };
    host.querySelector('#ok').onclick = los; ein.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); los(); } };
  };
  zeig();
}

// ---------- Spiel H: Wippen-Duell (Gleichgewicht mit möglichst wenigen Stücken, 3 Runden) ----------
function spielWippe(host, fertig) {
  const RUNDEN = 3, mom = o => Object.keys(o).reduce((s, p) => s + p * o[p], 0), Nsum = o => Object.keys(o).reduce((s, p) => s + o[p], 0);
  const st = { L: {}, R: {}, ang: 0, tool: 'plus', runde: 1, punkte: 0, erg: null };
  const neu = () => { for (;;) { st.L = {}; shuffle([1, 2, 3, 4, 5]).slice(0, rnd(2, 3)).forEach(p => st.L[p] = rnd(1, 3)); const M = mom(st.L); if (M >= 8 && M <= 40 && Nsum(st.L) > Math.ceil(M / 5)) break; } st.R = {}; st.erg = null; st.ang = 0; };
  neu();
  host.innerHTML = `<p class="small muted" id="anl"></p><div class="labfig" id="sf"></div><div id="lr"></div><div class="row" id="tools"></div><div class="anzeige" id="anz"></div><div id="sfb" aria-live="polite"></div>`;
  const q = s => host.querySelector(s);
  const draw = () => {
    const ml = mom(st.L), mr = mom(st.R), ziel = Math.max(-14, Math.min(14, (mr - ml) * 2.2)), gl = ml === mr && mr > 0, nR = Nsum(st.R), kmin = Math.ceil(ml / 5);
    q('#anl').innerHTML = `<b>Runde ${st.runde} von ${RUNDEN}</b> · ${st.punkte} ${st.punkte === 1 ? 'Punkt' : 'Punkte'}<br>Links hängen Gewichtsstücke (je 1 N). Bring den Balken ins Gleichgewicht – mit <b>so wenigen Stücken wie möglich</b> rechts (Zahlen: Abstand in cm). Bestlösung: 10 Punkte. Nur spiegeln gibt Abzug.`;
    const tools = q('#tools');
    if (st.erg) {
      tools.innerHTML = `<button class="btn" id="wr">${st.runde < RUNDEN ? 'Nächste Runde' : 'Fertig'}</button>`;
      q('#wr').onclick = () => { if (st.runde >= RUNDEN) return fertig(st.punkte >= 27 ? 3 : st.punkte >= 20 ? 2 : 1, `${st.punkte} von 30 Punkten`); st.runde++; neu(); draw(); };
    } else {
      tools.innerHTML = `<div class="seg" id="tool"><button data-v="plus">➕ anhängen</button><button data-v="minus">➖ abnehmen</button></div><button class="btn" id="ab" ${gl ? '' : 'disabled'}>Abgeben</button><button class="btn ghost" id="leer" ${nR ? '' : 'disabled'}>Rechts leeren</button>`;
      tools.querySelectorAll('#tool button').forEach(b => { b.classList.toggle('on', b.dataset.v === st.tool); b.onclick = () => { st.tool = b.dataset.v; draw(); }; });
      q('#leer').onclick = () => { st.R = {}; draw(); };
      q('#ab').onclick = () => {
        const kopie = Object.keys(st.L).length === Object.keys(st.R).length && Object.keys(st.L).every(p => st.R[p] === st.L[p]);
        const diff = nR - kmin, basis = diff <= 0 ? 10 : diff === 1 ? 7 : diff === 2 ? 5 : 3, pkt = kopie ? Math.max(1, basis - 3) : basis;
        st.punkte += pkt; st.erg = { pkt, diff, kopie, abzug: basis - pkt, kmin }; draw();
      };
    }
    const fig = q('#sf'); fig.innerHTML = wippeSvg(st.L, st.R, st.ang, !st.erg);
    const tipp = p => { if (st.tool === 'plus') { if (nR < 12 && (st.R[p] || 0) < 9) st.R[p] = (st.R[p] || 0) + 1; } else if (st.R[p]) { st.R[p]--; if (!st.R[p]) delete st.R[p]; } draw(); };
    fig.querySelectorAll('.hit').forEach(h => h.onclick = () => tipp(+h.dataset.p));
    // große Knöpfe unter der Zeichnung: auf dem Handy sind die Löcher zum Tippen zu schmal
    q('#lr').innerHTML = st.erg ? '' : `<div class="lochrow"><span class="small muted">rechts bei</span>${[1, 2, 3, 4, 5].map(p => `<button type="button" class="opt" data-p="${p}" aria-label="${st.tool === 'plus' ? 'Gewichtsstück anhängen' : 'Gewichtsstück abnehmen'} bei ${p * 10} Zentimeter">${p * 10}</button>`).join('')}<span class="small muted">cm</span></div>`;
    q('#lr').querySelectorAll('button').forEach(b => b.onclick = () => tipp(+b.dataset.p));
    const balken = fig.querySelector('g');
    const step = () => { st.ang += (ziel - st.ang) * 0.18; if (Math.abs(ziel - st.ang) > 0.05) animId = requestAnimationFrame(step); else { st.ang = ziel; animId = null; } balken.setAttribute('transform', `rotate(${st.ang.toFixed(2)} 180 120)`); };
    if (animId) cancelAnimationFrame(animId); step();
    const teil = o => Object.keys(o).sort().map(p => `${o[p]} N · ${p * 10} cm`).join(' + ') || '0';
    // Rechnung verrät die Lösung – nur auf Wunsch oder nach dem Abgeben
    const rech = st.rechnung || st.erg;
    q('#anz').innerHTML = `${rech ? `<span>links: ${teil(st.L)} = <b>${ml * 10} Ncm</b></span><span>rechts: ${teil(st.R)} = <b>${mr * 10} Ncm</b></span>` : ''}<span>Stücke rechts: <b>${nR}</b></span>${gl && !st.erg ? '<span class="gut">✓ Gleichgewicht! Geht es mit weniger? Sonst: Abgeben.</span>' : ''}${st.erg ? '' : `<button type="button" class="btn ghost" id="rech">${st.rechnung ? '🙈 Rechnung ausblenden' : '🧮 Rechnung zeigen'}</button>`}`;
    if (!st.erg) q('#rech').onclick = () => { st.rechnung = !st.rechnung; draw(); };
    let fb = '';
    if (st.erg) {
      const e = st.erg, v = Math.floor(ml / 5), rest = ml % 5, best = [v ? `${v} ${v === 1 ? 'Stück' : 'Stücke'} bei 50 cm` : '', rest ? `1 Stück bei ${rest * 10} cm` : ''].filter(Boolean).join(' + ');
      const lob = e.diff <= 0 ? pick(['Perfekt – weniger geht nicht! 🎯', 'Volltreffer, das ist eine Bestlösung! ⭐', 'Hebelprofi! Genau so wenige wie nötig. 💪']) : e.diff === 1 ? 'Gleichgewicht! Ganz knapp – mit einem Stück weniger wäre es perfekt gewesen.' : 'Gleichgewicht geschafft! Es geht aber mit weniger Stücken.';
      fb = `<div class="fb"><div class="msg ok"><b>+${e.pkt} ${e.pkt === 1 ? 'Punkt' : 'Punkte'}.</b> ${lob}${e.kopie ? ` Du hast die linke Seite gespiegelt – das klappt immer, darum <b>−${e.abzug}</b>.` : ''}${e.diff > 0 ? `<br>Eine Bestlösung mit <b>${e.kmin}</b> Stücken: ${best}. Merke: Weiter außen wirkt jedes Stück stärker.` : ''}</div></div>`;
    }
    q('#sfb').innerHTML = fb;
  };
  draw();
}

// ---------- Spiel R: Kran-Chef (passende Anordnung: Kraft reicht UND Seil reicht) ----------
function spielKran(host, fertig) {
  const OPT = [[1, 'feste Rolle'], [2, 'lose Rolle'], [4, 'Flaschenzug, 4 Seilstücke'], [6, 'Flaschenzug, 6 Seilstücke']];
  const mk = n => {
    const i = OPT.findIndex(o => o[0] === n), vor = i ? OPT[i - 1][0] : null, nach = OPT[i + 1] ? OPT[i + 1][0] : null;
    const L = n * pick([50, 75, 100]), h = pick([2, 3, 4]);
    let Fmax = Math.ceil(L / n * 1.15 / 10) * 10; if (vor && Fmax >= L / vor) Fmax = L / n;
    return { n, L, h, Fmax, Smax: n * h + (nach ? 1 : 2) };
  };
  // jede Anordnung kann vorkommen (auch die feste Rolle), nur nicht dreimal dieselbe
  let ns; do { ns = [0, 1, 2].map(() => pick([1, 2, 4, 6])); } while (ns[0] === ns[1] && ns[1] === ns[2]);
  const A = ns.map(mk);
  let i = 0, wahl = null, fehler = 0, laeuft = false, geschafft = false, versucht = new Set();
  const zeig = () => {
    const a = A[i];
    host.innerHTML = `<div class="anzeige"><span>Auftrag <b>${i + 1}</b> von 3</span><span>Fehlversuche: <b>${fehler}</b></span></div>
      <div class="q">Die Kiste hat eine Gewichtskraft von <b>${a.L} N</b> und soll <b>${a.h} m</b> hoch. Du schaffst höchstens <b>${a.Fmax} N</b> Zugkraft, und dein Seil lässt sich höchstens <b>${a.Smax} m</b> weit ziehen. Welche Anordnung baust du?</div>
      <div class="opts liste" id="wahl">${OPT.map(o => `<button type="button" class="opt ${wahl === o[0] ? 'sel' : ''}" data-n="${o[0]}">${o[1]}</button>`).join('')}</div>
      <div class="labfig schmal" id="sf">${wahl ? rollenSvg(wahl, 0, { last: a.L + ' N', zaehl: true }) : ''}</div>
      <div class="row"><button class="btn" id="hoch" ${wahl && !geschafft && !versucht.has(wahl) ? '' : 'disabled'}>Hochziehen!</button></div><div id="sfb" aria-live="polite"></div>`;
    host.querySelectorAll('#wahl .opt').forEach(b => b.onclick = () => { if (laeuft || geschafft) return; wahl = +b.dataset.n; zeig(); });
    host.querySelector('#hoch').onclick = () => {
      if (laeuft || !wahl || versucht.has(wahl)) return;
      const F = a.L / wahl, s = wahl * a.h, fb = host.querySelector('#sfb');
      if (F > a.Fmax || s > a.Smax) { versucht.add(wahl); host.querySelector('#hoch').disabled = true; }
      if (F > a.Fmax) { fehler++; host.querySelector('.anzeige').lastElementChild.innerHTML = `Fehlversuche: <b>${fehler}</b>`; fb.innerHTML = `<div class="fb"><div class="msg no"><b>Zu schwer!</b> Mit ${wahl === 1 ? 'der festen Rolle' : wahl + ' tragenden Seilstücken'} müsstest du mit ${zahl(a.L)} N : ${wahl} = <b>${zahl(F)} N</b> ziehen – du schaffst aber nur ${a.Fmax} N. Du brauchst mehr tragende Seilstücke.</div></div>`; return; }
      if (s > a.Smax) { fehler++; host.querySelector('.anzeige').lastElementChild.innerHTML = `Fehlversuche: <b>${fehler}</b>`; fb.innerHTML = `<div class="fb"><div class="msg no"><b>Das Seil reicht nicht!</b> Die Kraft passt (${zahl(F)} N), aber du müsstest ${wahl} · ${a.h} m = <b>${s} m</b> Seil ziehen – erlaubt sind ${a.Smax} m. Kraft sparen kostet Weg.</div></div>`; return; }
      laeuft = true; host.querySelector('#hoch').disabled = true;
      anim(1800, t => { host.querySelector('#sf').innerHTML = rollenSvg(wahl, 1.2 * ease(t), { last: a.L + ' N', F: zahl(F) + ' N', zaehl: true }); }, () => {
        laeuft = false; geschafft = true;
        fb.innerHTML = `<div class="fb"><div class="msg ok"><b>✓ Oben!</b> Kraft: ${a.L} N : ${wahl} = ${zahl(F)} N. Seilweg: ${wahl} · ${a.h} m = ${s} m. ${wahl > 1 ? 'Weniger Seilstücke wären zu schwer' : 'Die Kraft reicht auch ohne Kraftersparnis'}${wahl < 6 ? ', mehr würden zu viel Seil brauchen' : ''}.</div><div class="row"><button class="btn" id="wr">${i === 2 ? 'Fertig' : 'Nächster Auftrag'}</button></div></div>`;
        host.querySelector('#wr').onclick = () => { if (i === 2) return fertig(ausFehlern(fehler), fehler ? `${fehler} Fehlversuch${fehler === 1 ? '' : 'e'}` : 'Jeder Kran auf Anhieb richtig!'); i++; wahl = null; geschafft = false; versucht = new Set(); zeig(); };
      });
    };
  };
  zeig();
}

// ---------- Mission ----------

      box.querySelectorAll('#to .opt').forEach(x => { x.disabled = true; const xj = +x.dataset.j; x.classList.add(xj === st.a ? (xj === j ? 'ok' : 'fehlt') : xj === j ? 'no' : 'x'); });
      st.fig(box.querySelector('#tf'), true, () => {
        box.querySelector('#tfb').innerHTML = `<div class="fb"><div class="msg ${ok ? 'ok' : 'no'}"><b>${ok ? '✓ Richtig getippt!' : '✗ Überraschung!'}</b> ${st.e}</div><div class="row"><button class="btn" id="wt">Weiter</button></div></div>`;
        box.querySelector('#wt').onclick = next;

    st.run(box.querySelector('#sp'), (stars, info) => { MR.stars = stars; MR.info = info; next(); });

}
function renderMerk(box) {
  const m = MIS[MR.k], teile = m.merk.split(/\{([^}]+)\}/), lsg = teile.filter((x, i) => i % 2);
  let pos = 0, fehl = 0; const chips = shuffle(lsg.concat(m.falsch));
  const satz = () => teile.map((x, i) => i % 2 ? `<span class="gap ${(i - 1) / 2 < pos ? 'voll' : (i - 1) / 2 === pos ? 'dran' : ''}">${(i - 1) / 2 < pos ? esc(x) : '&nbsp;?&nbsp;'}</span>` : x).join('');
  const zeig = () => {
    const fertig = pos >= lsg.length;
    box.innerHTML = `<div class="eyebrow">Merksatz bauen</div><p class="small muted">${fertig ? 'Geschafft – der Satz steht jetzt auf deinem Spickzettel.' : 'Tippe das Wort an, das in die markierte Lücke gehört.'}</p><p class="msatz">${satz()}</p>
      ${fertig ? '' : `<div class="chips">${chips.map((c, j) => c == null ? '' : `<button type="button" class="chip" data-j="${j}">${esc(c)}</button>`).join('')}</div>`}<div id="mfb" aria-live="polite"></div>`;
    if (fertig) {
      const alt = S.st[MR.k] || 0; S.st[MR.k] = Math.max(alt, MR.stars || 1); S.merk[MR.k] = true; save();
      const nxt = MKEYS.find(k => !S.merk[k]);
      box.querySelector('#mfb').innerHTML = `<div class="fb"><div class="msg ok"><b>Mission geschafft! ${sterne(MR.stars || 1)}</b> ${MR.info || ''}${S.st[MR.k] < 3 ? ' – für drei Sterne kannst du die Mission jederzeit noch einmal spielen.' : ''}</div>
        <div class="row">${nxt ? `<button class="btn" id="nm">Nächste Mission: ${MIS[nxt].icon} ${MIS[nxt].name}</button>` : `<button class="btn" id="nb">Zu den Endgegnern 👾</button>`}<button class="btn ghost" id="hm">Zur Übersicht</button></div></div>`;
      const nm = box.querySelector('#nm'); if (nm) nm.onclick = () => startMis(nxt);
      const nb = box.querySelector('#nb'); if (nb) nb.onclick = () => go('boss');
      box.querySelector('#hm').onclick = () => go('home');
      return;
    }
    box.querySelectorAll('.chip').forEach(b => b.onclick = () => {
      const j = +b.dataset.j;
      if (chips[j] === lsg[pos]) { chips[j] = null; pos++; zeig(); }
      else { fehl++; b.classList.remove('wackel'); void b.offsetWidth; b.classList.add('wackel'); b.disabled = true; setTimeout(() => { if (b.isConnected) b.disabled = false; }, 1500); if (fehl >= 3) box.querySelector('#mfb').innerHTML = `<p class="small muted">Tipp: Lies den Satz bis zur Lücke laut – was passt in der Sache?</p>`; }
    });
  };
  zeig();
}

// ---------- Blitzrunde ----------
const BK = { PF: ['Länge des Pfeils', 'Pfeilspitze', 'Was am Kraftpfeil zeigt das?'], VB: ['Verformung', 'Bewegungsänderung', 'Welche Wirkung hat die Kraft?'], EP: ['elastisch', 'plastisch', 'Wie ist die Verformung?'], MG: ['Masse', 'Gewichtskraft', 'Masse oder Gewichtskraft?'], EZ: ['einseitig', 'zweiseitig', 'Was für ein Hebel?'], FL: ['feste Rolle', 'lose Rolle', 'Welche Rolle?'] };
const BPOOL = [
  ['Ein Torwart fängt den Ball.', 'VB', 1], ['Knete wird zu einer Kugel gerollt.', 'VB', 0], ['Ein Radfahrer biegt um die Ecke.', 'VB', 1], ['Ein Bogen wird gespannt.', 'VB', 0], ['Ein Auto bremst an der Ampel.', 'VB', 1], ['Ein Fußball wird abgeschossen.', 'VB', 1], ['Eine leere Dose wird zerdrückt.', 'VB', 0],
  ['Ein Gummiband wird gedehnt und losgelassen.', 'EP', 0], ['Ein Auto bekommt eine Delle.', 'EP', 1], ['Die Feder im Kraftmesser wird gezogen.', 'EP', 0], ['Ein Blatt Papier wird zerknüllt.', 'EP', 1], ['Das Sprungtuch im Trampolin gibt nach.', 'EP', 0], ['Knete wird platt gedrückt.', 'EP', 1],
  ['den Betrag: wie groß die Kraft ist', 'PF', 0], ['die Richtung der Kraft', 'PF', 1],
  ['Einheit: Kilogramm (kg)', 'MG', 0], ['Einheit: Newton (N)', 'MG', 1], ['ist auf dem Mond kleiner als auf der Erde', 'MG', 1], ['ist überall gleich', 'MG', 0], ['misst man mit dem Federkraftmesser', 'MG', 1], ['misst man mit der Balkenwaage', 'MG', 0], ['Formelzeichen m', 'MG', 0], ['hängt vom Ort ab', 'MG', 1],
  ['Wippe', 'EZ', 1], ['Schere', 'EZ', 1], ['Schubkarre', 'EZ', 0], ['Nussknacker', 'EZ', 0], ['Flaschenöffner', 'EZ', 0], ['Kneifzange', 'EZ', 1], ['Balkenwaage', 'EZ', 1],
  ['lenkt die Kraft nur um', 'FL', 0], ['halbiert die nötige Kraft', 'FL', 1], ['bewegt sich mit der Last nach oben', 'FL', 1], ['hängt fest an der Decke', 'FL', 0], ['heißt auch Umlenkrolle', 'FL', 0], ['man zieht doppelt so viel Seil', 'FL', 1]
];
function renderBlitz() {
  if (!BL) {
    app.innerHTML = `<header class="top"><div class="eyebrow">Training</div><h1>⚡ Blitzrunde</h1><p class="muted">45 Sekunden. Zu jedem Satz gibt es zwei Antworten – tippe die richtige an. Jeder Treffer bringt einen Punkt, jeder Fehler kostet einen.</p></header>
      <section><div class="card"><div class="anzeige"><span>Rekord: <b>${S.blitz || '–'}</b></span></div><div class="row"><button class="btn gross" id="go">Start</button><button class="btn ghost" id="hm">Zur Übersicht</button></div></div></section>`;
    app.querySelector('#go').onclick = () => { BL = { ende: Date.now() + 45000, n: 0, serie: 0, best: 0, falsch: [], q: shuffle(BPOOL), i: 0, sperre: false }; render(); };
    app.querySelector('#hm').onclick = () => go('home'); return;
  }
  if (BL.fertig) {
    const neu = BL.n > S.blitz; if (neu) { S.blitz = BL.n; save(); }
    const fl = BL.falsch.filter((x, i, a) => a.findIndex(y => y[0] === x[0]) === i);
    app.innerHTML = `<header class="top"><div class="eyebrow">Blitzrunde</div><h1>${BL.n} ${BL.n === 1 ? 'Punkt' : 'Punkte'} ${neu ? '– neuer Rekord! 🎉' : ''}</h1><p class="muted">Längste Serie: ${BL.best} · Rekord: ${S.blitz}</p></header>
      <section>${fl.length ? `<div class="card"><h3>Das schau dir noch einmal an</h3><ul class="fehler">${fl.map(x => `<li>${esc(x[0])} → <b>${BK[x[1]][x[2]]}</b></li>`).join('')}</ul></div>` : (BL.n > 0 ? '<div class="card"><p><b>Kein einziger Fehler!</b> 💪</p></div>' : '')}
      <div class="row"><button class="btn" id="go">Noch einmal</button><button class="btn ghost" id="hm">Zur Übersicht</button></div></section>`;
    app.querySelector('#go').onclick = () => { BL = null; render(); app.querySelector('#go').click(); };
    app.querySelector('#hm').onclick = () => go('home'); return;
  }
  app.innerHTML = `<section><div class="card blitz"><div class="meter"><i id="zeit" style="width:100%"></i></div><div class="anzeige"><span>Punkte: <b id="bn">0</b></span><span>Serie: <b id="bs">0</b></span></div>
    <div class="small muted" id="bk"></div><div class="bsatz" id="bq"></div><div class="bwahl"><button type="button" class="opt" data-j="0"></button><button type="button" class="opt" data-j="1"></button></div><div class="small" id="bfb">&nbsp;</div></div></section>`;
  const q = s => app.querySelector(s), btn = [...app.querySelectorAll('.bwahl .opt')];
  const frage = () => { if (BL.i >= BL.q.length) { BL.q = shuffle(BPOOL); BL.i = 0; } const f = BL.q[BL.i]; q('#bk').textContent = BK[f[1]][2]; q('#bq').textContent = f[0]; btn.forEach((b, j) => { b.textContent = BK[f[1]][j]; b.className = 'opt'; }); BL.sperre = false; };
  btn.forEach(b => b.onclick = () => {
    if (BL.sperre || BL.fertig) return; BL.sperre = true;
    const f = BL.q[BL.i], j = +b.dataset.j, ok = j === f[2];
    if (ok) { BL.n++; BL.serie++; BL.best = Math.max(BL.best, BL.serie); b.classList.add('ok'); q('#bfb').innerHTML = BL.serie >= 3 ? `🔥 ${BL.serie} in Folge` : '&nbsp;'; }
    else { BL.serie = 0; BL.n = Math.max(0, BL.n - 1); BL.falsch.push(f); b.classList.add('no'); btn[f[2]].classList.add('fehlt'); q('#bfb').innerHTML = `✗ richtig: <b>${BK[f[1]][f[2]]}</b>`; }
    q('#bn').textContent = BL.n; q('#bs').textContent = BL.serie;
    BL.i++; const meine = BL; setTimeout(() => { if (BL === meine && !BL.fertig && VIEW === 'blitz') frage(); }, ok ? 220 : 1100);
  });
  frage();
  timerId = setInterval(() => { const rest = BL.ende - Date.now(); const z = q('#zeit'); if (z) z.style.width = Math.max(0, rest / 450) + '%'; if (rest <= 0) { BL.fertig = true; stopAll(); render(); } }, 100);
}

// ---------- Endgegner ----------
function renderBoss() {
  if (!BR) {
    const offen = BOSS.filter(b => !S.boss[b[0]]);
    app.innerHTML = `<header class="top"><div class="eyebrow">Training</div><h1>👾 Endgegner</h1><p class="muted">${BOSS.length} Gegner, ${BOSS.length} Aufgabenarten aus der Klassenarbeit. Rechne richtig, dann ist der Gegner besiegt – und bleibt es. Bei einem Fehler siehst du den Rechenweg, und er kommt mit neuen Zahlen wieder.</p></header>
      <section><div class="grid">${BOSS.map(b => `<div class="tile ${S.boss[b[0]] ? 'done' : ''}"><b>${b[1]} ${b[2]}</b><span>${b[3]}</span><span class="tag">${S.boss[b[0]] ? '✓ besiegt' : 'wartet auf dich'}</span></div>`).join('')}</div>
      <div class="row">${offen.length ? `<button class="btn gross" id="go">${offen.length === BOSS.length ? 'Kampf starten' : 'Weiterkämpfen'} (${offen.length} übrig)</button>` : '<p><b>🏆 Alle Endgegner besiegt!</b> Zum Üben kannst du noch einmal gegen alle antreten.</p><button class="btn" id="neu">Noch einmal gegen alle</button>'}<button class="btn ghost" id="hm">Zur Übersicht</button></div></section>`;
    const g = app.querySelector('#go'); if (g) g.onclick = () => { BR = { q: offen.map(b => b[0]), frei: false }; bossNeu(); render(); window.scrollTo(0, 0); };
    const n = app.querySelector('#neu'); if (n) n.onclick = () => { BR = { q: BOSS.map(b => b[0]), frei: true }; bossNeu(); render(); window.scrollTo(0, 0); };
    app.querySelector('#hm').onclick = () => go('home'); return;
  }
  const b = BOSS.find(x => x[0] === BR.typ), it = BR.it, A = BR.A;
  app.innerHTML = `<header class="top"><div class="eyebrow">Endgegner · noch ${BR.q.length}</div><h1>${b[1]} ${b[2]}</h1><p class="muted">${b[3]}</p></header>
    <section><div class="card" id="box">${itemHtml(it, A, BR.fertig)}${BR.fertig ? '' : tippBox(it.h)}<div id="bfb" aria-live="polite"></div></div></section>`;
  const box = app.querySelector('#box'), fb = box.querySelector('#bfb');
  if (BR.fertig) {
    const ok = BR.ok;
    fb.innerHTML = `<div class="fb"><div class="msg ${ok ? 'ok' : 'no'}"><b>${ok ? `✓ ${b[2]} besiegt!` : '✗ Diesmal gewinnt der Gegner.'}</b> ${it.e || ''}${ok ? '' : ' <b>Er kommt gleich mit neuen Zahlen wieder.</b>'}</div><div class="row"><button class="btn" id="wr">${BR.q.length ? 'Weiter' : 'Zur Siegerehrung'}</button><button class="btn ghost" id="pa">Pause</button></div></div>`;
    box.querySelector('#wr').onclick = () => { if (!BR.q.length) { BR = null; go('boss'); return; } bossNeu(); render(); window.scrollTo(0, 0); };
    box.querySelector('#pa').onclick = () => { BR = null; go('home'); };
    spaeterFokus(box.querySelector('#wr')); return;
  }
  fb.innerHTML = `<div class="row"><button class="btn" id="an">Angriff!</button><span class="small muted" id="leer"></span><button class="btn ghost" id="pa">Pause</button></div>`;
  felderBinden(box, A); tippBinden(box);
  const los = () => {
    const w = itemWert(it, A); if (w.some(x => x.leer)) { box.querySelector('#leer').textContent = 'Da fehlt noch eine Antwort.'; return; }
    if (it.fields.some((f, i) => f.t === 'num' && isNaN(parseZahl(A[fkey(it, i)])))) { box.querySelector('#leer').textContent = 'Da steht etwas, das keine Zahl ist.'; return; }
    BR.ok = w.every(x => x.ok); BR.fertig = true; BR.q.shift();
    if (BR.ok) { if (!BR.frei || !S.boss[BR.typ]) { S.boss[BR.typ] = true; save(); } } else BR.q.push(BR.typ);
    render();
  };
  box.querySelector('#an').onclick = los; box.querySelector('#pa').onclick = () => { BR = null; go('home'); };
  box.querySelectorAll('input[data-k]').forEach(el => el.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); los(); } });
}
function bossNeu() { BR.typ = BR.q[0]; BR.it = genItem(BR.typ); BR.A = {}; BR.fertig = false; BR.ok = false; }

// ---------- Spickzettel ----------
function renderSpick() {
  app.innerHTML = `<header class="top"><div class="eyebrow">Zum Wiederholen</div><h1>📄 Spickzettel</h1><p class="muted">Jede Mission schaltet ihren Merksatz frei. Kurz vor der Arbeit: einmal durchlesen.</p></header>
    <section>${MKEYS.map((k, i) => { const m = MIS[k]; return `<div class="card"><h3>${m.icon} ${i + 1} · ${m.thema}</h3>${S.merk[k] ? `<p class="msatz">${m.merk.replace(/\{([^}]+)\}/g, '<b>$1</b>')}</p><ul class="plus">${m.plus.map(p => `<li>${p}</li>`).join('')}</ul>` : `<p class="muted">🔒 Noch gesperrt. Spiel die Mission „${m.name}“, dann steht hier dein Merksatz.</p><div class="row"><button class="btn ghost" data-m="${k}">Mission starten</button></div>`}</div>`; }).join('')}
    <div class="row"><button class="btn" id="dr">Drucken</button><button class="btn ghost" id="hm">Zur Übersicht</button></div></section>`;
  app.querySelectorAll('[data-m]').forEach(b => b.onclick = () => startMis(b.dataset.m));
  app.querySelector('#dr').onclick = () => window.print();
  app.querySelector('#hm').onclick = () => go('home');
}

// gehaltene Enter-Taste soll nicht durch die Rückmeldungen rasen
document.addEventListener('keydown', e => { if (e.repeat && e.key === 'Enter') e.preventDefault(); }, true);
document.getElementById('homeBtn').onclick = () => { BR = null; BL = null; go('home'); };
render();
</script>
</body>
